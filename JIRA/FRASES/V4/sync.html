<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Sincronização - Frases Prontas V4</title>
</head>
<body>
<script>
(() => {
  "use strict";

  const STORE = "jira_frases_v4";
  const SCOPE = "jira-frases-sync-v4";
  const CHANNEL = `${STORE}:shared`;
  const CLIENT_ID = `bridge-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
  const clients = new Map();
  const memory = {};
  const isHub = location.hash.includes("hub");
  let channel = null;

  if (isHub) {
    document.body.innerHTML = [
      '<main style="font-family:Arial,sans-serif;padding:16px;line-height:1.35;color:#172033">',
      '<strong>Frases Prontas</strong>',
      '<p style="margin:8px 0 0">Sincronização ativa. Mantenha esta janela aberta para refletir alterações entre páginas diferentes.</p>',
      '</main>'
    ].join("");
  }

  try {
    channel = new BroadcastChannel(CHANNEL);
    channel.addEventListener("message", event => {
      const message = event.data || {};
      if (!message.key || message.source === CLIENT_ID) return;
      sendUpdate({ key: message.key, value: message.value, source: message.source });
    });
  } catch {
    channel = null;
  }

  window.addEventListener("message", onMessage);
  window.addEventListener("storage", event => {
    if (!event.key || !event.key.startsWith(`${STORE}:`)) return;
    const key = event.key.slice(STORE.length + 1);
    if (key !== "data" && key !== "config") return;
    sendUpdate({ key, value: read(key, null), source: "storage" });
  });

  if (!isHub) sendToParent({ action: "ready" });

  function onMessage(event) {
    const message = event.data || {};
    if (message.scope !== SCOPE) return;
    rememberClient(message.source, event.source);
    try {
      if (message.action === "connect") {
        sendTo(event.source, { action: "ready", data: read("data", null), config: read("config", null) });
        return;
      }
      if (message.action === "snapshot") {
        reply(event.source, message, { data: read("data", null), config: read("config", null) });
        return;
      }
      if (message.action === "set") {
        const value = message.key === "config" ? mergeConfig(read("config", null), message.value) : message.value;
        write(message.key, value);
        broadcast(message.key, value, message.source);
        reply(event.source, message, { key: message.key, value });
        return;
      }
      if (message.action === "incrementUsage") {
        const config = mergeConfig(read("config", null), null);
        config.usage = normalizeUsage(config.usage);
        config.usage[message.phraseId] = Math.max(0, Math.floor(Number(config.usage[message.phraseId]) || 0)) + 1;
        write("config", config);
        broadcast("config", config, message.source);
        reply(event.source, message, { key: "config", config });
        return;
      }
      reply(event.source, message, {}, false, "Ação inválida.");
    } catch (error) {
      reply(event.source, message, {}, false, error.message || "Erro inesperado.");
    }
  }

  function read(key, fallback) {
    try {
      const raw = localStorage.getItem(`${STORE}:${key}`);
      if (raw) {
        memory[key] = JSON.parse(raw);
        return memory[key];
      }
    } catch {
      return memory[key] || fallback;
    }
    return memory[key] || fallback;
  }

  function write(key, value) {
    if (key !== "data" && key !== "config") throw new Error("Chave inválida.");
    memory[key] = value;
    try {
      localStorage.setItem(`${STORE}:${key}`, JSON.stringify(value));
    } catch {}
  }

  function mergeConfig(current, incoming) {
    const base = current && typeof current === "object" ? current : {};
    const next = incoming && typeof incoming === "object" ? { ...base, ...incoming } : { ...base };
    next.usage = mergeUsage(base.usage, incoming?.usage);
    return next;
  }

  function mergeUsage(left, right) {
    const merged = { ...normalizeUsage(left), ...normalizeUsage(right) };
    Object.keys(merged).forEach(id => {
      merged[id] = Math.max(
        Math.floor(Number(left?.[id]) || 0),
        Math.floor(Number(right?.[id]) || 0)
      );
    });
    return merged;
  }

  function normalizeUsage(input) {
    if (!input || typeof input !== "object" || Array.isArray(input)) return {};
    return Object.fromEntries(Object.entries(input).map(([id, count]) => [
      String(id || "").trim(),
      Math.max(0, Math.floor(Number(count) || 0))
    ]).filter(([id]) => id));
  }

  function broadcast(key, value, source) {
    sendUpdate({ key, value, source: source || CLIENT_ID });
    try {
      channel?.postMessage({ key, value, source: source || CLIENT_ID });
    } catch {}
  }

  function reply(target, message, payload = {}, ok = true, error = "") {
    sendTo(target, { replyTo: message.requestId, ok, error, ...payload });
  }

  function rememberClient(id, target) {
    if (!id || !target) return;
    clients.set(id, target);
  }

  function sendUpdate({ key, value, source }) {
    const payload = { action: "update", key, value, source: source || CLIENT_ID };
    if (!clients.size) {
      sendToParent(payload);
      return;
    }
    clients.forEach((target, id) => {
      if (id !== source) sendTo(target, payload);
    });
  }

  function sendToParent(payload) {
    if (window.parent && window.parent !== window) sendTo(window.parent, payload);
  }

  function sendTo(target, payload) {
    try {
      target?.postMessage({ scope: SCOPE, source: CLIENT_ID, ...payload }, "*");
    } catch {}
  }
})();
</script>
</body>
</html>
