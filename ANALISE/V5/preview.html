<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAC Prevenção - Prévia V5</title>
  <style>
    :root{--bg:#101823;--panel:#182536;--card:#111a27;--border:#40566f;--text:#edf4fb;--muted:#b8c8da;--input:#0d1520;--banking:#00856f;--cardTone:#2563eb;--hold:#ff5a1f;--history:#64748b;--scale:1}
    [data-theme="light"]{--bg:#f4f7fb;--panel:#fff;--card:#f8fafd;--border:#ced9e8;--text:#172033;--muted:#5b697f;--input:#fff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
    .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg)}
    h1{margin:0;font-size:17px;line-height:1.1}.hint{font-size:12px;color:var(--muted);font-weight:800}
    .toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.toolbar button{height:31px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);font-size:12px;font-weight:950;padding:0 10px;cursor:pointer}.toolbar button:hover,.toolbar button:focus{border-color:#38bdf8;box-shadow:0 0 0 2px rgba(56,189,248,.18);outline:none}.toolbar button.active{color:#fff}
    .canvas{padding:12px}.stage-grid{display:grid;grid-template-columns:repeat(3,420px);gap:10px;align-items:start;justify-content:center}
    .window{--tone:var(--banking);position:relative;width:420px;min-width:420px;max-width:420px;border:1px solid var(--border);border-top:3px solid var(--tone);border-radius:8px;background:var(--panel);box-shadow:0 18px 38px rgba(0,0,0,.24);overflow:visible}
    .window.minimized{height:auto}.window.minimized .body,.window.minimized .config{display:none!important}
    .head{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;background:var(--tone);color:#fff;cursor:grab;user-select:none;touch-action:none}.head:active,.history-head:active{cursor:grabbing}
    .title{display:flex;align-items:center;gap:6px;font-size:calc(12px * var(--scale));font-weight:950;line-height:1.1}.dot{width:10px;height:10px;border-radius:999px;background:var(--tone);border:2px solid rgba(255,255,255,.72)}.sub{font-size:calc(9px * var(--scale));font-weight:850;opacity:.9}
    .actions{display:flex;gap:4px}.icon{width:25px;height:25px;border:1px solid rgba(255,255,255,.36);border-radius:5px;background:rgba(255,255,255,.14);color:#fff;font-weight:950;display:grid;place-items:center;cursor:pointer;padding:0}.icon:hover,.icon:focus{filter:brightness(1.16);box-shadow:0 0 0 2px rgba(255,255,255,.18);outline:none}.icon.close{background:rgba(127,29,29,.34)}
    .config{position:absolute;left:8px;top:38px;width:268px;z-index:5;display:none;gap:7px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--panel);box-shadow:0 14px 34px rgba(0,0,0,.32)}.config.open{display:grid}
    .config-title{font-size:11px;font-weight:950;color:var(--muted);text-transform:uppercase}.config-preview{border:1px solid var(--border);border-radius:7px;background:var(--card);padding:7px;font-size:11px;font-weight:900;overflow-wrap:anywhere}.config input,.config select,.config button{width:100%;min-height:31px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text);font-size:12px;font-weight:850;padding:6px 7px}.config input:hover,.config select:hover,.config button:hover,.config input:focus,.config select:focus,.config button:focus{border-color:#38bdf8;background:#12314a;color:#edf3fb;box-shadow:0 0 0 2px rgba(56,189,248,.22);outline:none}[data-theme="light"] .config input:hover,[data-theme="light"] .config select:hover,[data-theme="light"] .config button:hover,[data-theme="light"] .config input:focus,[data-theme="light"] .config select:focus,[data-theme="light"] .config button:focus{background:#eef7ff;color:#172033}
    .split{display:grid;grid-template-columns:1fr auto 1fr;gap:0}.split button:first-child{border-radius:6px 0 0 6px}.split button:last-child{border-left:0;border-radius:0 6px 6px 0}.font-value{display:grid;place-items:center;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--card);color:var(--muted);font-size:11px;font-weight:950;padding:0 8px}.signature-editor,.color-editor{display:none;gap:6px}.signature-editor.open,.color-editor.open{display:grid}.signature-custom[hidden]{display:none}.color-row{display:grid;grid-template-columns:64px 1fr;gap:6px;align-items:center}.color-row strong{font-size:10px;color:var(--muted);font-weight:950}.swatches{display:flex;gap:5px;flex-wrap:wrap}.swatch{width:20px!important;height:20px!important;min-width:20px;border-radius:999px!important;padding:0!important;border:2px solid var(--border)!important;background:var(--swatch)!important}.swatch.active{border-color:#fff!important;box-shadow:0 0 0 2px var(--swatch)}
    .body{padding:5px;display:grid;gap:5px}.section{border:1px solid var(--border);border-radius:6px;background:var(--card);padding:5px}.section-title{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;color:var(--muted);font-size:calc(9px * var(--scale));font-weight:950;text-transform:uppercase}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
    .kv{position:relative;min-width:0;min-height:34px;margin-top:7px;border:1px solid var(--border);border-radius:5px;background:var(--panel);padding:7px 4px 4px;transition:border-color .15s,box-shadow .15s,background .15s,color .15s}.kv:hover,.field:hover{border-color:#38bdf8;background:#10263a;color:#edf3fb;box-shadow:0 0 0 2px rgba(56,189,248,.12)}[data-theme="light"] .kv:hover,[data-theme="light"] .field:hover{background:#eef7ff;color:#172033}.kv label{position:absolute;top:-8px;left:4px;max-width:calc(100% - 8px);padding:1px 3px;border-radius:3px;background:var(--card);font-size:calc(8px * var(--scale));line-height:1;color:var(--muted);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kv span{display:flex;align-items:center;min-height:23px;font-size:calc(11px * var(--scale));line-height:1.08;font-weight:850;overflow-wrap:anywhere;white-space:normal}
    .history-ok{background:#052e1a;border-color:#15803d}.history-warn,.missing,.alert-warn{background:#3a230b;border-color:#c2410c;animation:pulseOrange 1s ease-in-out infinite}.history-danger,.alert-danger{background:#3a0d0d;border-color:#ef4444;animation:pulseRed 1s ease-in-out infinite}[data-theme="light"] .history-ok{background:#ecfdf5}[data-theme="light"] .history-warn,[data-theme="light"] .missing,[data-theme="light"] .alert-warn{background:#fff7ed}[data-theme="light"] .history-danger,[data-theme="light"] .alert-danger{background:#fef2f2}
    @keyframes pulseRed{0%,100%{box-shadow:0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 12px rgba(239,68,68,.65)}}@keyframes pulseOrange{0%,100%{box-shadow:0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 12px rgba(245,158,11,.70)}}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:4px}.call-grid{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:4px}.call-box{display:grid;grid-template-columns:1fr 1fr;gap:4px;border:1px solid var(--border);border-radius:6px;background:var(--panel);padding:5px}.call-box[aria-disabled="true"]{opacity:.52}.call-box strong{grid-column:1/-1;color:var(--muted);font-size:calc(8.4px * var(--scale));text-transform:uppercase}.call-box label{display:flex;gap:5px;align-items:center;font-size:calc(10px * var(--scale));font-weight:900}.field{display:grid;gap:2px;min-width:0;border:1px solid var(--border);border-radius:6px;background:var(--panel);padding:4px}.field label{display:block;font-size:calc(8.4px * var(--scale));line-height:1.05;color:var(--muted);font-weight:900}.field select,.field input{width:100%;height:28px;border:1px solid var(--border);border-radius:5px;background:var(--input);color:var(--text);font-size:calc(10.5px * var(--scale));font-weight:800;padding:2px}.field select:hover,.field select:focus,.field input:hover,.field input:focus{border-color:#38bdf8;background:#10263a;color:#edf3fb;outline:none;box-shadow:0 0 0 2px rgba(56,189,248,.16)}[data-theme="light"] .field select:hover,[data-theme="light"] .field select:focus,[data-theme="light"] .field input:hover,[data-theme="light"] .field input:focus{background:#eef7ff;color:#172033}
    .main-btn,.ghost{width:100%;min-height:32px;border:1px solid var(--border);border-radius:6px;background:var(--tone);color:#fff;font-size:calc(12px * var(--scale));font-weight:950;padding:7px 10px;line-height:1.12;cursor:pointer;white-space:normal;overflow-wrap:anywhere}.ghost{background:transparent;color:var(--text)}.main-btn:hover,.ghost:hover{filter:brightness(1.12);box-shadow:0 0 0 2px rgba(56,189,248,.16)}
    .decisions{display:grid;grid-template-columns:1fr 1fr;gap:4px}.decision{min-height:56px;border:0;border-radius:6px;color:#fff;font-size:calc(11px * var(--scale));line-height:1.08;font-weight:950;white-space:pre-line;cursor:pointer;padding:7px 5px;overflow-wrap:anywhere}.decision:hover{filter:brightness(1.12);box-shadow:0 0 0 2px rgba(255,255,255,.15)}.danger{background:#dc2626}.success{background:#15803d}.warning{background:#ca8a04}.info{background:#2563eb}
    textarea{width:100%;height:245px;resize:none;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text);font-size:13px;line-height:1.2;font-weight:750;padding:8px;overflow:hidden}.motive{height:62px;font-size:12px}.final-text{height:286px;font-size:13px;line-height:1.18}.final-text.card{height:214px}.apply-status{border:1px solid var(--border);border-left:4px solid #2563eb;border-radius:6px;background:var(--card);padding:7px;font-size:11px;font-weight:900}.apply-status.ok{border-left-color:#16a34a}
    .notice{position:fixed;right:12px;bottom:12px;display:grid;gap:6px;z-index:80}.toast{width:320px;border:1px solid var(--border);border-left:4px solid #2563eb;border-radius:8px;background:var(--panel);color:var(--text);padding:9px;font-size:12px;font-weight:850;box-shadow:0 12px 26px rgba(0,0,0,.25)}.toast.success{border-left-color:#22c55e;background:#062e1b;color:#ecfdf5}.toast.warn{border-left-color:#f59e0b;background:#351f05;color:#fff7ed}.toast.error{border-left-color:#dc2626;background:#3a0d0d;color:#fef2f2}[data-theme="light"] .toast{background:#fff;color:#172033}[data-theme="light"] .toast.success{background:#ecfdf5;color:#064e3b}[data-theme="light"] .toast.warn{background:#fff7ed;color:#7c2d12}[data-theme="light"] .toast.error{background:#fef2f2;color:#7f1d1d}
    .history-panel{position:fixed;right:12px;bottom:12px;width:780px;max-width:calc(100vw - 24px);max-height:min(720px,calc(100vh - 24px));z-index:50;border:1px solid var(--border);border-top:3px solid var(--history);border-radius:8px;background:var(--panel);box-shadow:0 18px 42px rgba(0,0,0,.34);display:none;overflow:hidden}.history-panel.open{display:block}.history-head{display:flex;justify-content:space-between;align-items:center;padding:7px 8px;background:var(--history);color:#fff;font-weight:950;cursor:grab;user-select:none;touch-action:none}.history-tools{display:grid;grid-template-columns:1fr 126px;gap:6px;padding:7px;border-bottom:1px solid var(--border);background:var(--card)}.history-tools input,.history-tools select{height:34px;border:1px solid var(--border);border-radius:7px;background:var(--input);color:var(--text);font-size:12px;font-weight:900;padding:7px 9px}.history-body{display:grid;grid-template-columns:236px 1fr;gap:6px;padding:6px}.history-list{display:grid;gap:4px;align-content:start;max-height:560px;overflow:auto}.history-list button{text-align:left;min-height:38px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text);font-weight:950;cursor:pointer}.history-list button:hover,.history-list button.active{border-color:#38bdf8;background:#10263a;color:#edf3fb;box-shadow:0 0 0 2px rgba(56,189,248,.12);transform:translateY(-1px)}[data-theme="light"] .history-list button:hover,[data-theme="light"] .history-list button.active{background:#eef7ff;color:#172033}.history-list small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.history-panel textarea{height:520px;overflow:auto}
    .list-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px}.list-tabs button{border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text);font-size:12px;font-weight:950;padding:8px 6px;cursor:pointer}.list-tabs button:hover,.list-tabs button.active{border-color:#38bdf8;background:#12314a;color:#edf3fb;box-shadow:0 0 0 2px rgba(56,189,248,.14)}[data-theme="light"] .list-tabs button:hover,[data-theme="light"] .list-tabs button.active{background:#eef7ff;color:#172033}.allow-window{position:fixed;left:18px;top:86px;width:min(720px,calc(100vw - 36px));z-index:40}.allow-list{display:grid;gap:5px;max-height:min(560px,calc(100vh - 210px));overflow:auto;padding-right:3px}.allow-item{display:grid;grid-template-columns:1fr 72px;gap:6px;border:1px solid var(--border);border-radius:7px;background:var(--card);padding:6px}.allow-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}.allow-actions{display:grid;grid-template-rows:1fr 1fr;gap:4px}.allow-actions button{border:0;border-radius:6px;color:#fff;font-size:10px;font-weight:950;cursor:pointer}.allow-actions .insert{background:#16a34a}.allow-actions .remove{background:#dc2626}
    .choice-popover{position:fixed;left:14px;top:72px;z-index:70;width:min(354px,calc(100vw - 28px));display:grid;gap:7px;padding:0 10px 10px;border:1px solid var(--border);border-top:3px solid var(--cardTone);border-radius:8px;background:var(--panel);color:var(--text);box-shadow:0 18px 44px rgba(0,0,0,.32)}.choice-head{margin:0 -10px;padding:8px 10px;background:var(--cardTone);color:#fff;display:flex;justify-content:space-between;align-items:center;border-radius:6px 6px 0 0}.pid-note{border:1px solid #f59e0b;border-radius:6px;background:#3a230b;color:#fff7ed;padding:6px;font-size:10.5px;font-weight:900}.pid-group{display:grid;gap:4px}.pid-group strong{font-size:10px;color:var(--muted);text-transform:uppercase}.pid-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.pid-card{border:1px solid var(--border);border-radius:6px;background:var(--card);padding:6px;min-height:34px;font-size:10.5px;font-weight:850;line-height:1.12;display:flex;align-items:center}
    @media(max-width:1320px){.stage-grid{grid-template-columns:1fr}.window{margin:auto}.allow-window{left:8px;right:8px;width:auto}.grid{grid-template-columns:1fr}.history-body{grid-template-columns:1fr}}
  </style>
</head>
<body data-theme="dark">
  <div class="top">
    <div>
      <h1>SAC Prevenção - Prévia V5</h1>
      <div class="hint">V5: janelas fixas, PID lateral, LISTAS com memória e favorito único estável</div>
    </div>
    <div class="toolbar">
      <button data-flow="banking" class="active">BANKING</button>
      <button data-flow="card">CARTÃO</button>
      <button data-flow="hold">HOLD</button>
      <button id="listasBtn">LISTAS</button>
      <button id="theme">☀</button>
    </div>
  </div>
  <main class="canvas"><div class="stage-grid" id="grid"></div></main>
  <div class="notice" id="notice"></div>
  <div class="history-panel" id="history">
    <div class="history-head"><span>Histórico</span><button class="icon close" id="closeHistory">×</button></div>
    <div class="history-tools"><input id="historySearch" placeholder="Pesquisar caso, emissor ou conta"><select id="historyFilter"><option value="">Todos</option><option>BANKING</option><option>CARTÃO</option><option>HOLD</option></select></div>
    <div class="history-body"><div class="history-list" id="historyList"></div><textarea readonly id="historyText"></textarea></div>
  </div>
  <script>
    const STATUS_OPTIONS=["normal","ativo","bloqueado","bloqueio preventivo falcon 254","cancelada","spd 1","spd 2","spd 8","spd 15","spd 17","spd 21","spd 25","spd 33","outro"];
    const MEDIA_OPTIONS=["não","sim","sem acesso"],HISTORY_SPD=["não","sim","spd 1","spd 2","spd 8","spd 15","spd 17","spd 21","spd 25","spd 33","outro"],EMAIL_OPTIONS=["de acordo","divergente","sem informação"],DOC_OPTIONS=["sem ressalvas","com ressalvas","baixa qualidade","foto de tela","editado","falsificado","ilegível","danificado","sem arquivos"],STATEMENT_OPTIONS=["sem suspeitas","com suspeitas","triangulação","autofinanciamento","sem histórico"],MERCHANT_HISTORY_OPTIONS=["sim","não","sem histórico","ausência de dados"],PURCHASE_PATTERN_OPTIONS=["dentro do padrão","fora do padrão","ausência de dados"];
    const PID_DEFAULT_REQUIRED=["Dois últimos dígitos do CPF","Cinco últimos dígitos do cartão","Data aproximada e estabelecimento da última compra"],PID_DEFAULT_COMPLEMENTARY=["Data de nascimento completa","Endereço de correspondência cadastrado","Telefone alternativo, se houver","Nome da mãe cadastrado","Limite aproximado do cartão, se for crédito","Saldo da conta, se for pré-pago"],PID_AMIGOZ_REQUIRED=["Nome da mãe","Final do CPF","Data de nascimento","Últimos dígitos do cartão","Vencimento da fatura","Última compra"];
    const colors=[["#ef4444","vermelho"],["#ff5a1f","laranja"],["#f59e0b","amarelo"],["#22c55e","verde"],["#14b8a6","turquesa"],["#2563eb","azul"],["#7c3aed","violeta"]];
    const flows={
      banking:{label:"BANKING",tone:"#00856f",caseNumber:"49373570",value:"10.511,48",rule:"TETO_PIX_PF_CCSB",history:"0000000000",historyClass:"history-ok",transactionType:"Pagamento bancário de varejo",date:"08/06/2026 07:29",cpf:"36.986.078/0001-74",issuer:"ONLYPAY",treatment:"BRASIL",account:"16740",accountStatus:"ativo",register:"12/09/2025",fields:{media:"não",spd:"normal",email:"de acordo",histSpd:"não",doc:"sem ressalvas",extrato:"sem suspeitas"}},
      card:{label:"CARTÃO",tone:"#2563eb",caseNumber:"49373601",value:"289,90",rule:"CARD_ECOMMERCE_RISK",cardNumber:"4917********1422",merchant:"SEG Novo Seguros",flowType:"autorização ou lançamento de crédito",transactionType:"E-commerce",transDecision:"approve",date:"08/06/2026 08:41",cpf:"123.456.789-10",issuer:"AMIGOZ",treatment:"BRASIL",cardId:"72424",cardStatus:"normal",register:"20/05/2026",fields:{callMode:"sem chamada",callResult:"",merchantHistory:"",purchase:""}},
      hold:{label:"HOLD",tone:"#ff5a1f",caseNumber:"49373744",value:"4.850,00",rule:"HOLD_PIX_CONTENÇÃO_ALTO_RISCO",history:"0003003003",historyClass:"history-danger",transactionType:"Transferência Pix",date:"08/06/2026 09:14",cpf:"987.654.321-00",issuer:"SOFISA",treatment:"GLOBAL",account:"65420",accountStatus:"bloqueio preventivo falcon 254",register:"20/04/2024",fields:{media:"sim",spd:"spd 8",email:"divergente",histSpd:"spd 8",doc:"falsificado",extrato:"triangulação"}}
    };
    const decisions=["FRAUDE","NÃO FRAUDE","NÃO FOI POSSÍVEL\nCONFIRMAR FRAUDE","NÃO FOI POSSÍVEL\nCONFIRMAR NÃO FRAUDE"];
    let current="banking",safeMode=true,fontScale=1,historyRows=[{flow:"BANKING",caseNumber:"49373570",issuer:"ONLYPAY",account:"16740"},{flow:"HOLD",caseNumber:"49373744",issuer:"SOFISA",account:"65420"}],activeList="allowlist";
    const norm=v=>String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
    const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
    function toast(msg,type="info"){const el=document.createElement("div");el.className="toast "+type;el.textContent=msg;notice.appendChild(el);setTimeout(()=>el.remove(),7600)}
    function kv(label,value,cls=""){const missing=!value||String(value)==="N/A";return `<div class="kv ${missing?"missing":""} ${cls}"><label>${esc(label)}</label><span>${esc(value||"N/A")}</span></div>`}
    function section(title,content,meta=""){return `<section class="section"><div class="section-title"><span>${title}</span><span>${meta}</span></div>${content}</section>`}
    function defaultAlert(value,options){const n=norm(value);if(["SEM HISTORICO","AUSENCIA DE DADOS","SEM INFORMACAO","SEM ARQUIVOS","SEM ACESSO"].includes(n))return"alert-warn";return n&&n!==norm(options[0])?"alert-danger":""}
    function accountAlert(v){return ["NORMAL","ATIVO","ATIVA"].includes(norm(v))?"":"alert-danger"}
    function falconGrid(f){const common=kv("Caso",f.caseNumber)+kv("Valor","R$ "+f.value)+kv("Regra",f.rule)+kv("Data/Hora",f.date);if(current==="card")return `<div class="grid">${kv("Tipo transação",f.flowType)}${kv("Estabelecimento",f.merchant)}${kv("Tipo compra cartão",f.transactionType)}${kv("Decisão transação",f.transDecision)}${common}</div>`;return `<div class="grid">${kv("Tipo transação",f.transactionType)}${common}${kv("Histórico de infrações",f.history,f.historyClass)}</div>`}
    function consoleGrid(f){if(current==="card")return `<div class="grid">${kv("CPF/CNPJ",f.cpf)}${kv("Emissor",f.issuer)}${kv("Tratativa",f.treatment)}${kv("ID cartão",f.cardId)}${kv("Cartão",f.cardNumber)}${kv("Status cartão",f.cardStatus)}${kv("Cadastro",f.register)}</div>`;return `<div class="grid">${kv("CPF/CNPJ",f.cpf)}${kv("Emissor",f.issuer)}${kv("Tratativa",f.treatment)}${kv("Conta",f.account)}${kv("Status conta",f.accountStatus,accountAlert(f.accountStatus))}${kv("Cadastro",f.register)}</div>`}
    function optionList(opts,selected,allowEmpty=false){return (allowEmpty?`<option value="">Selecione</option>`:"")+opts.map(o=>`<option ${norm(o)===norm(selected)?"selected":""}>${esc(o)}</option>`).join("")}
    function field(id,label,opts,value,allowEmpty=false){return `<label class="field"><label>${label}</label><select id="${id}">${optionList(opts,value,allowEmpty)}</select></label>`}
    function callFields(f){const mode=norm(f.fields.callMode)==="COM CHAMADA";return `<div class="call-grid"><div class="call-box"><strong>Chamada</strong><label><input type="radio" name="callMode" value="sem chamada" ${!mode?"checked":""}>Sem chamada</label><label><input type="radio" name="callMode" value="com chamada" ${mode?"checked":""}>Com chamada</label></div><div class="call-box" data-call-result aria-disabled="${mode?"false":"true"}"><strong>Resultado</strong><label><input type="radio" name="callResult" value="com sucesso" ${norm(f.fields.callResult)==="COM SUCESSO"?"checked":""} ${!mode?"disabled":""}>Com sucesso</label><label><input type="radio" name="callResult" value="sem sucesso" ${norm(f.fields.callResult)==="SEM SUCESSO"?"checked":""} ${!mode?"disabled":""}>Sem sucesso</label></div></div>`}
    function dropdownFields(f){return current==="card"?callFields(f)+field("mh","Histórico no estabelecimento",MERCHANT_HISTORY_OPTIONS,f.fields.merchantHistory,true)+field("pp","Padrão de compra",PURCHASE_PATTERN_OPTIONS,f.fields.purchase,true):field("ps","Status Pessoa (SPD)",STATUS_OPTIONS,f.fields.spd)+field("hs","Histórico SPD",HISTORY_SPD,f.fields.histSpd)+field("bm","Mídia desabonadora",MEDIA_OPTIONS,f.fields.media)+field("em","E-mail, DDD e Endereço",EMAIL_OPTIONS,f.fields.email)+field("dc","Documentação",DOC_OPTIONS,f.fields.doc)+field("ex","Extrato",STATEMENT_OPTIONS,f.fields.extrato)}
    function dropdownGrid(f){return current==="card"?`<div class="grid">${kv("Chamada",f.fields.callMode||"sem chamada")}${norm(f.fields.callMode)==="COM CHAMADA"?kv("Resultado da chamada",f.fields.callResult||"N/A"):""}${kv("Histórico no estabelecimento",f.fields.merchantHistory,defaultAlert(f.fields.merchantHistory,MERCHANT_HISTORY_OPTIONS))}${kv("Padrão de compra",f.fields.purchase,defaultAlert(f.fields.purchase,PURCHASE_PATTERN_OPTIONS))}</div>`:`<div class="grid">${kv("Status Pessoa (SPD)",f.fields.spd,defaultAlert(f.fields.spd,STATUS_OPTIONS))}${kv("Histórico SPD",f.fields.histSpd,defaultAlert(f.fields.histSpd,HISTORY_SPD))}${kv("Mídia desabonadora",f.fields.media,defaultAlert(f.fields.media,MEDIA_OPTIONS))}${kv("E-mail, DDD e Endereço",f.fields.email,defaultAlert(f.fields.email,EMAIL_OPTIONS))}${kv("Documentação",f.fields.doc,defaultAlert(f.fields.doc,DOC_OPTIONS))}${kv("Extrato",f.fields.extrato,defaultAlert(f.fields.extrato,STATEMENT_OPTIONS))}</div>`}
    function tabText(f,decision="FRAUDE",motive=""){const d=decision.replace(/\n/g," ");const m=motive?`\nMotivo: ${motive}`:"";if(current==="card")return `Valor da transação: R$ ${f.value}\nRegra: ${f.rule}\nEstabelecimento: ${f.merchant}\nStatus do cartão: ${f.cardStatus}\nData de cadastro: ${f.register}\nHistórico de compra no estabelecimento: ${f.fields.merchantHistory||""}\nPadrão de compra: ${f.fields.purchase||""}\n\nDecisão: ${d}${m}\n\nGiasi Mandela | SAC Prevenção`;return `Valor da transação: R$ ${f.value}\nRegra: ${f.rule}\nHistórico de Infrações: ${f.history}\nMídia desabonadora: ${f.fields.media}\nStatus conta: ${f.accountStatus}\nStatus Pessoa (SPD): ${f.fields.spd}\nData de cadastro: ${f.register}\nE-mail, DDD e Endereço: ${f.fields.email}\nHistórico SPD: ${f.fields.histSpd}\nDocumentação: ${f.fields.doc}\nExtrato: ${f.fields.extrato}\n\nDecisão: ${d}${m}\n\nGiasi Mandela | SAC Prevenção`}
    function config(stage){const sig=stage==="TABULADOR"?`<button data-act="signature">✎ Assinatura</button><div class="signature-editor"><div class="config-preview">Giasi Mandela | SAC Prevenção</div><input value="Giasi Mandela"><select><option>SAC Prevenção</option><option>Dock Teck Prevenção</option><option>Backoffice Prevenção</option><option value="custom">Personalizado</option></select><input class="signature-custom" hidden placeholder="Complemento personalizado"><button>Salvar assinatura</button></div>`:"";return `<div class="config"><div class="config-title">Configurações</div><button data-act="theme">${document.body.dataset.theme==="dark"?"☀ Tema claro":"☾ Tema escuro"}</button><div class="split"><button data-act="font-">A−</button><span class="font-value">${Math.round(fontScale*100)}%</span><button data-act="font+">A+</button></div><button data-act="safe">${safeMode?"🛡 Seguro ligado":"⚠ Seguro desligado"}</button>${sig}<button data-act="colors">Cores dos fluxos</button><div class="color-editor">${Object.entries(flows).map(([k,f])=>`<div class="color-row"><strong>${f.label}</strong><div class="swatches">${colors.map(([c,n])=>`<button class="swatch ${f.tone===c?"active":""}" style="--swatch:${c}" data-flow-color="${k}" data-color="${c}" aria-label="${n}"></button>`).join("")}</div></div>`).join("")}</div><button data-act="history">Histórico</button></div>`}
    function head(stage,f){return `<div class="head"><div><div class="title"><span class="dot"></span>${stage} - ${f.label}</div><div class="sub">${stage==="FALCON"?"Coleta Falcon":stage==="CONSOLE"?"Conferência Console":"Decisão Tabulador"}</div></div><div class="actions"><button class="icon" data-act="config" aria-label="Configurações">⚙</button><button class="icon" data-act="reload" aria-label="Recarregar">↻</button><button class="icon" data-act="min" aria-label="Minimizar">_</button><button class="icon close" data-act="close" aria-label="Fechar">×</button></div>${config(stage)}</div>`}
    function falcon(f){return `<div class="window" style="--tone:${f.tone}">${head("FALCON",f)}<div class="body">${section("Dados do Falcon",falconGrid(f),f.label)}<button class="main-btn" data-finalize="falcon" style="--tone:${f.tone}">Finalizar etapa</button></div></div>`}
    function consoleWin(f){return `<div class="window" style="--tone:${f.tone}">${head("CONSOLE",f)}<div class="body">${section("Dados do Falcon",falconGrid(f),"recebidos")}${section("Dados do Console",consoleGrid(f),"coletados")}${section("Dropdowns de análise",`<div class="fields">${dropdownFields(f)}</div>`,"padrão V5")}<button class="main-btn" data-finalize="console" style="--tone:${f.tone}">Finalizar etapa</button></div></div>`}
    function tabulador(f){const buttons=decisions.map((d,i)=>`<button class="decision ${["danger","success","warning","info"][i]}" data-decision-index="${i}" data-decision="${d}">${d}</button>`).join("");return `<div class="window tab-window" style="--tone:${f.tone}">${head("TABULADOR",f)}<div class="body tab-body">${section("Dados do Falcon",falconGrid(f),"análise")}${section("Dados do Console",consoleGrid(f),"coletados")}${section("Respostas dos dropdowns",dropdownGrid(f),"escolhidas")}${section("Motivo",`<textarea class="motive" id="previewMotive" placeholder="Escrita livre opcional"></textarea>`,"opcional")}${section("Decisão",`<div class="decisions">${buttons}</div>`,"1-4")}</div></div>`}
    function render(){closePid();document.querySelectorAll("[data-flow]").forEach(b=>{const active=b.dataset.flow===current;b.classList.toggle("active",active);b.style.background=active?flows[b.dataset.flow].tone:"";b.style.borderColor=active?flows[b.dataset.flow].tone:""});const f=flows[current];document.getElementById("grid").innerHTML=falcon(f)+consoleWin(f)+tabulador(f);document.querySelectorAll(".window").forEach(w=>enableDrag(w,".head"));bindCall()}
    function enableDrag(panel,selector){const h=panel.querySelector(selector);if(!h||panel.dataset.drag)return;panel.dataset.drag=1;let armed=false,drag=false,sx=0,sy=0,sl=0,st=0,sw=0,sh=0,old="";const clamp=(v,min,max)=>Math.min(Math.max(v,min),max);h.addEventListener("pointerdown",e=>{if(e.target.closest("button,input,select,textarea,a"))return;const r=panel.getBoundingClientRect();document.querySelectorAll(".window,.history-panel,.choice-popover").forEach(x=>x.style.zIndex=30);panel.style.zIndex=60;armed=true;drag=false;sx=e.clientX;sy=e.clientY;sl=r.left;st=r.top;sw=r.width;sh=r.height;old=document.body.style.userSelect;document.body.style.userSelect="none";try{h.setPointerCapture(e.pointerId)}catch{}e.preventDefault()});document.addEventListener("pointermove",e=>{if(!armed)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!drag&&Math.hypot(dx,dy)<3)return;if(!drag){drag=true;panel.style.position="fixed";panel.style.left=sl+"px";panel.style.top=st+"px";panel.style.right="auto";panel.style.bottom="auto";panel.style.transform="none"}panel.style.left=clamp(sl+dx,0,Math.max(0,innerWidth-sw))+"px";panel.style.top=clamp(st+dy,0,Math.max(0,innerHeight-Math.min(sh,innerHeight)))+"px";e.preventDefault()},true);document.addEventListener("pointerup",e=>{armed=false;drag=false;document.body.style.userSelect=old;try{h.releasePointerCapture(e.pointerId)}catch{}},true)}
    function bindCall(){document.querySelectorAll("input[name='callMode'],input[name='callResult']").forEach(i=>i.addEventListener("change",()=>{const mode=document.querySelector("input[name='callMode']:checked")?.value||"sem chamada";flows.card.fields.callMode=mode;const enabled=norm(mode)==="COM CHAMADA";document.querySelectorAll("input[name='callResult']").forEach(r=>{r.disabled=!enabled;if(!enabled)r.checked=false});document.querySelector("[data-call-result]")?.setAttribute("aria-disabled",enabled?"false":"true");flows.card.fields.callResult=enabled?(document.querySelector("input[name='callResult']:checked")?.value||""):"";if(current==="card"&&enabled)openPid(flows.card);else closePid()}))}
    function openPid(f){closePid();const amigoz=norm(f.issuer).includes("AMIGOZ");const items=amigoz?PID_AMIGOZ_REQUIRED:PID_DEFAULT_REQUIRED,comp=amigoz?[]:PID_DEFAULT_COMPLEMENTARY;const p=document.createElement("div");p.id="pid";p.className="choice-popover";p.innerHTML=`<div class="choice-head"><strong>${amigoz?"PID - AMIGOZ":"PID - CARTÃO"}</strong><button class="icon close" data-pid-close>×</button></div><div class="pid-note">${amigoz?"AMIGOZ possui PID próprio. Não bloquear sem tentativa de contato, salvo fraude crítica evidente.":"Tempo mínimo de espera no ativo: 30 segundos. Não revele quais respostas divergiram."}</div><div class="pid-group"><strong>Dados obrigatórios</strong><div class="pid-grid">${items.map(x=>`<div class="pid-card">${x}</div>`).join("")}</div></div>${comp.length?`<div class="pid-group"><strong>Dados complementares</strong><div class="pid-grid">${comp.map(x=>`<div class="pid-card">${x}</div>`).join("")}</div></div>`:""}`;document.body.appendChild(p);const host=document.querySelector(".window:nth-child(2)");if(host){const r=host.getBoundingClientRect();p.style.left=Math.max(8,r.left-374)+"px";p.style.top=Math.max(8,r.top)+"px"}}
    function closePid(){document.getElementById("pid")?.remove()}
    function listItem(issuer,label,id,caseNumber,se){return `<div class="allow-item"><div class="allow-row">${kv("Emissor",issuer)}${kv(label,id)}${kv("Número do caso",caseNumber)}${kv("ID emissor",se)}</div><div class="allow-actions"><button class="insert">INSERIR</button><button class="remove">REMOVER</button></div></div>`}
    function openListas(tab=activeList){closePid();activeList=tab;document.querySelector(".allow-window")?.remove();const items=tab==="contencao"?[listItem("SOFISA","CPF/CNPJ","98765432100","49373744","155")]:[listItem("ONLYPAY","Id Conta","16740","49373570","520"),listItem("SOFISA","Id Conta","65420","49373744","155"),listItem("Dock","Id Conta","99887","49373888","10142"),listItem("Ifood","Id Conta","44512","49373912","520"),listItem("Jeitto","Id Conta","33420","49373999","10142")];document.body.insertAdjacentHTML("beforeend",`<div class="window allow-window" style="--tone:var(--history)">${head("LISTAS",{label:"LISTAS",tone:"var(--history)"})}<div class="body">${section("Allowlist e Contenção",`<div class="list-tabs"><button data-list-tab="allowlist" class="${tab==="allowlist"?"active":""}">ALLOWLIST</button><button data-list-tab="contencao" class="${tab==="contencao"?"active":""}">CONTENÇÃO</button></div><div class="allow-list">${items.join("")}</div>`,"pendentes")}</div></div>`);enableDrag(document.querySelector(".allow-window"),".head")}
    function openHistory(){history.classList.add("open");enableDrag(history,".history-head");renderHistoryRows()}
    function renderHistoryRows(){const q=norm(historySearch.value),f=historyFilter.value;const rows=historyRows.filter(r=>(!f||r.flow===f)&&(!q||norm(`${r.caseNumber} ${r.issuer} ${r.account}`).includes(q)));historyList.innerHTML=rows.map((r,i)=>`<button class="${i===0?"active":""}" data-case="${r.caseNumber}">${r.caseNumber}<small>${r.issuer} · Conta ${r.account} · ${r.flow}</small></button>`).join("")||"<small>Nenhum histórico encontrado.</small>";historyText.value=rows[0]?tabText(flows[rows[0].flow==="CARTÃO"?"card":rows[0].flow.toLowerCase()]):""}
    document.addEventListener("click",async e=>{const flow=e.target.closest("[data-flow]");if(flow){current=flow.dataset.flow;render();return}if(e.target.id==="theme"||e.target.closest("[data-act='theme']")){document.body.dataset.theme=document.body.dataset.theme==="dark"?"light":"dark";theme.textContent=document.body.dataset.theme==="dark"?"☀":"☾";render();return}if(e.target.id==="listasBtn"){openListas();return}const act=e.target.closest("[data-act]"),win=e.target.closest(".window");if(act?.dataset.act==="config"){win.querySelector(".config").classList.toggle("open");return}if(act?.dataset.act==="min"){win.classList.toggle("minimized");return}if(act?.dataset.act==="close"){win.remove();closePid();toast("Janela fechada.","info");return}if(act?.dataset.act==="reload"){render();toast("Prévia recarregada.","info");return}if(act?.dataset.act==="safe"){safeMode=!safeMode;act.textContent=safeMode?"🛡 Seguro ligado":"⚠ Seguro desligado";toast(safeMode?"Modo seguro ligado.":"Modo seguro desligado.","warn");return}if(act?.dataset.act==="font-"||act?.dataset.act==="font+"){fontScale=Math.min(1.18,Math.max(.92,fontScale+(act.dataset.act==="font+"?.05:-.05)));document.documentElement.style.setProperty("--scale",fontScale);document.querySelectorAll(".font-value").forEach(x=>x.textContent=Math.round(fontScale*100)+"%");return}if(act?.dataset.act==="signature"){win.querySelector(".signature-editor").classList.toggle("open");return}if(act?.dataset.act==="colors"){win.querySelector(".color-editor").classList.toggle("open");return}if(act?.dataset.act==="history"){openHistory();return}const sw=e.target.closest("[data-flow-color]");if(sw){const duplicate=Object.entries(flows).some(([k,v])=>k!==sw.dataset.flowColor&&v.tone===sw.dataset.color);if(duplicate){toast("Cada fluxo precisa ter uma cor diferente.","warn");return}flows[sw.dataset.flowColor].tone=sw.dataset.color;render();return}if(e.target.closest("[data-pid-close]")){closePid();return}if(e.target.closest("[data-list-tab]")){openListas(e.target.dataset.listTab);return}if(e.target.closest(".allow-actions button")){e.target.closest(".allow-item").remove();toast(e.target.classList.contains("insert")?"Dados simulados inseridos e caso removido.":"Caso removido da lista.",e.target.classList.contains("insert")?"success":"warn");return}if(e.target.id==="closeHistory"){history.classList.remove("open");return}if(e.target.closest("[data-finalize]")){win.remove();toast("Etapa finalizada e dados enviados para a próxima fase.","success");return}const dec=e.target.closest("[data-decision]");if(dec){const f=flows[current];if(current==="card"){f.fields.merchantHistory=document.getElementById("mh")?.value||"";f.fields.purchase=document.getElementById("pp")?.value||"";f.fields.callMode=document.querySelector("input[name='callMode']:checked")?.value||"sem chamada";f.fields.callResult=document.querySelector("input[name='callResult']:checked")?.value||"";if(!f.fields.merchantHistory||!f.fields.purchase||(norm(f.fields.callMode)==="COM CHAMADA"&&!f.fields.callResult)){toast("Selecione os dados obrigatórios do fluxo cartão antes de continuar.","error");return}}const text=tabText(f,dec.dataset.decision,previewMotive?.value.trim()||"");document.querySelector(".tab-body").innerHTML=section("Tabulação pronta",`<textarea class="final-text ${current==="card"?"card":""}" readonly>${esc(text)}</textarea>`,"final")+`<div class="apply-status ok">Tabulação copiada e campos aplicados na simulação.</div><div class="grid two"><button class="main-btn" data-copy-final>Copiar</button><button class="ghost" id="changeDecision">Mudar decisão</button></div>`;toast("Decisão aplicada. A tabulação ficará aberta até copiar.","success");if(dec.dataset.decision.replace(/\n/g," ")==="NÃO FRAUDE"&&current==="banking")openListas("allowlist");return}if(e.target.id==="changeDecision"){render();return}if(e.target.closest("[data-copy-final]")){win.remove();toast("Tabulação copiada. Processo finalizado.","success");return}});
    document.addEventListener("change",e=>{const label=e.target.closest(".field")?.querySelector("label")?.textContent||"";if(norm(label).includes("MIDIA")&&norm(e.target.value)==="SIM")toast("No código real, abre a janela lateral de mídia desabonadora sem itens marcados.","info");if(norm(label).includes("E-MAIL")&&norm(e.target.value)==="DIVERGENTE")toast("No código real, abre a janela lateral para detalhes da divergência.","info")});
    document.addEventListener("keydown",e=>{const tag=e.target?.tagName?.toLowerCase();if(["input","select","textarea"].includes(tag)&&e.key!=="Escape")return;const win=[...document.querySelectorAll(".window")].at(-1);if(!win)return;const k=e.key.toLowerCase();if(e.key==="Escape"){win.remove();e.preventDefault()}if(k==="m"){win.classList.toggle("minimized");e.preventDefault()}if(k==="p"){win.style.left="";win.style.top="";win.style.right="";win.style.position="";win.classList.remove("minimized");e.preventDefault()}if(k==="t"){theme.click();e.preventDefault()}if(k==="r"||e.key==="0"){render();e.preventDefault()}if(["1","2","3","4"].includes(e.key)){document.querySelector(`[data-decision-index="${Number(e.key)-1}"]`)?.click();e.preventDefault()}if(e.key==="Enter"){(win.querySelector("[data-finalize]")||win.querySelector("[data-copy-final]"))?.click();e.preventDefault()}});
    historySearch.addEventListener("input",renderHistoryRows);historyFilter.addEventListener("change",renderHistoryRows);historyList.addEventListener("click",e=>{const b=e.target.closest("[data-case]");if(!b)return;document.querySelectorAll(".history-list button").forEach(x=>x.classList.remove("active"));b.classList.add("active");const row=historyRows.find(r=>r.caseNumber===b.dataset.case);historyText.value=row?tabText(flows[row.flow==="CARTÃO"?"card":row.flow.toLowerCase()]):""});
    render();
  </script>
