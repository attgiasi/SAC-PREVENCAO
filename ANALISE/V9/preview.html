<body data-theme="dark">
  <header class="top">
    <div><h1>SAC Prevenção - Prévia V9</h1><div class="hint">Motores separados · aplicação somente após a decisão · memória própria para LISTAS e Histórico</div></div>
    <div class="toolbar">
      <button data-flow="banking" class="active">BANKING</button>
      <button data-flow="card">CARTÃO</button>
      <button data-flow="hold">HOLD</button>
      <select id="treatment"><option value="brasil">BACKOFFICE BRASIL</option><option value="global">GLOBAL BACKOFFICE</option></select>
      <button id="listsButton">LISTAS</button>
      <button id="themeButton">☀</button>
    </div>
  </header>
  <main class="canvas"><div class="stage" id="stage"></div></main>
  <div class="notice" id="notices"></div>
  <section class="history" id="history">
    <div class="history-head"><span>Histórico</span><button class="icon close" data-history-close>×</button></div>
    <div class="history-tools"><input id="historySearch" placeholder="Pesquisar caso, emissor ou conta"><select id="historyFilter"><option value="">Todos</option><option>BANKING</option><option>CARTÃO</option><option>HOLD</option></select></div>
    <div class="history-content"><div class="history-list" id="historyList"></div><textarea id="historyText" readonly></textarea></div>
  </section>
  <script>

      const STATEMENT_OPTIONS=["sem suspeitas","com suspeitas","triangulação","autofinanciamento","sem histórico"];
      const DECISIONS=["FRAUDE","NÃO FRAUDE","NÃO FOI POSSÍVEL\nCONFIRMAR FRAUDE","NÃO FOI POSSÍVEL\nCONFIRMAR NÃO FRAUDE"];

      function enableDrag(panel){const handle=panel.querySelector(".head");if(!handle||panel.dataset.drag)return;panel.dataset.drag="1";let armed=false,dragging=false,startX=0,startY=0,left=0,top=0,width=420;handle.addEventListener("pointerdown",event=>{if(event.target.closest("button,input,select,textarea,a"))return;const rect=panel.getBoundingClientRect();armed=true;dragging=false;startX=event.clientX;startY=event.clientY;left=rect.left;top=rect.top;width=420;event.preventDefault()});document.addEventListener("pointermove",event=>{if(!armed)return;const dx=event.clientX-startX,dy=event.clientY-startY;if(!dragging&&Math.hypot(dx,dy)<3)return;if(!dragging){dragging=true;panel.style.position="fixed";panel.style.left=`${left}px`;panel.style.top=`${top}px`;panel.style.right="auto";panel.style.inlineSize="420px";panel.style.width="420px";panel.style.minWidth="420px";panel.style.maxWidth="420px";panel.style.zIndex="120"}panel.style.left=`${Math.max(0,Math.min(left+dx,innerWidth-width))}px`;panel.style.top=`${Math.max(0,Math.min(top+dy,innerHeight-Math.min(panel.offsetHeight,innerHeight)))}px`;if(panel.dataset.stage==="console")placePid();syncAux(panel)},true);document.addEventListener("pointerup",()=>{armed=false;dragging=false},true)}
      function bindFields(){document.querySelectorAll(".field select").forEach(select=>select.addEventListener("change",()=>{current().fields[select.id]=select.value;if(select.id==="media"&&norm(select.value)==="SIM")openMediaChoice();if(select.id==="email"&&norm(select.value)==="DIVERGENTE")openEmailChoice()}));document.querySelectorAll("#callModeToggle,#callResultToggle").forEach(input=>input.addEventListener("change",syncCall));document.getElementById("jiraFlag")?.addEventListener("change",event=>{current().jiraActive=event.currentTarget.checked;const label=event.currentTarget.closest(".jira-toggle");label?.classList.toggle("on",event.currentTarget.checked);const state=label?.querySelector("b");if(state)state.textContent=event.currentTarget.checked?"Ligado":"Desligado"});document.querySelectorAll("[data-action='history']").forEach(button=>button.addEventListener("click",event=>{event.preventDefault();event.stopPropagation();openHistory()}));document.querySelectorAll(".kv").forEach(cell=>{cell.addEventListener("click",()=>copyGrid(cell));cell.addEventListener("dblclick",()=>editGrid(cell))})}
      function copyGrid(cell){if(!state.safe||cell.querySelector("input"))return;const value=cell.querySelector("span")?.textContent||"";const label=cell.dataset.label||"Dado";if(!value)return;navigator.clipboard?.writeText?.(value).catch(()=>{});cell.classList.add("copied");setTimeout(()=>cell.classList.remove("copied"),650);toast(`${label} copiado.`)}

      function editGrid(cell){if(state.safe){toast("Desligue o modo seguro para editar um grid manualmente.","warn");return}const value=cell.querySelector("span"),label=cell.dataset.label,input=document.createElement("input");input.value=value.textContent==="N/A"?"":value.textContent;input.style.cssText="width:100%;height:25px;border:1px solid var(--border);border-radius:4px;background:var(--input);color:var(--text);font-weight:850";value.replaceChildren(input);input.focus();const save=()=>{const next=input.value.trim();applyManual(label,next);value.textContent=next||"N/A";cell.classList.toggle("missing",!next)};input.addEventListener("keydown",event=>{if(event.key==="Enter")save()});input.addEventListener("blur",save,{once:true})}

      function showFinal(decision){const data=current();const jira=document.getElementById("jiraFlag")?.checked;if(jira){data.fields.callMode="jira";data.fields.callResult="com sucesso"}if(state.flow==="card"){data.fields.merchantHistory=document.getElementById("merchantHistory")?.value||"";data.fields.purchase=document.getElementById("purchase")?.value||"";if(!data.fields.merchantHistory||!data.fields.purchase||(norm(data.fields.callMode)==="COM CHAMADA"&&!data.fields.callResult)){toast("Inconsistência em: Tabulador > dados de análise do cartão.","error");return}}const text=tabulation(data,decision,document.getElementById("motive")?.value.trim()||"");state.applyingDecision=true;state.pendingFinal={data,decision:decision.replace(/\n/g," "),text};navigator.clipboard?.writeText?.(text).catch(()=>{});document.querySelectorAll("[data-decision]").forEach(button=>button.disabled=true);document.querySelector(".tab-body").insertAdjacentHTML("beforeend",`<div class="apply-status" id="decisionApplying">${jira?"JIRA ativo: RECEPTIVO e COM SUCESSO aplicados. ":""}Todos os campos foram aplicados. Aguardando apenas Motivo Status.</div>`);toast(jira?"Decisão copiada; JIRA aplicou RECEPTIVO / COM SUCESSO.":"Decisão copiada e campos aplicados imediatamente.","ok");setTimeout(()=>{state.applyingDecision=false;document.querySelector(".tab-body").innerHTML=section("Tabulação pronta",`<textarea class="final-text ${state.flow==="card"?"card":""}" readonly>${esc(text)}</textarea>`,"final")+`<div class="apply-status">Todos os campos, inclusive Motivo Status, foram confirmados.</div><div class="final-actions"><button class="main" data-copy data-ready="true">Copiar</button><button class="secondary" data-change>Mudar decisão</button></div>`;toast("Motivo Status confirmado. A tabulação está pronta.","ok")},650)}

      function finalizePreview(){const pending=state.pendingFinal;if(!pending)return;const same=item=>item.caseNumber===pending.data.caseNumber&&item.account===pending.data.account;state.lists=state.lists.filter(item=>!same(item));if(norm(pending.decision)==="NAO FRAUDE"&&state.flow==="banking"){state.lists.unshift({issuer:pending.data.issuer,account:pending.data.account,document:String(pending.data.cpf||"").replace(/\D/g,""),caseNumber:pending.data.caseNumber,issuerId:pending.data.issuer==="ONLYPAY"?"104":"513",containment:norm(pending.data.rule).includes("CONTEN")});toast("Caso finalizado e guardado em LISTAS.","ok")}else{toast("Caso finalizado; qualquer item igual foi retirado de LISTAS.","warn")}state.history.unshift({flow:pending.data.label,caseNumber:pending.data.caseNumber,issuer:pending.data.issuer,account:pending.data.account});state.pendingFinal=null}
