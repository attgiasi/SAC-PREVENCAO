<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAC Prevenção - Prévia V1</title>
  <style>
    :root{--bg:#0b111b;--panel:#111b29;--card:#172435;--border:#304056;--text:#f6f8fb;--muted:#b8c4d5;--input:#0d1623;--banking:#00856f;--cardflow:#2563eb;--hold:#ff5a1f;--warn:#f59e0b}
    [data-theme="light"]{--bg:#f4f7fb;--panel:#fff;--card:#f8fafd;--border:#d5deeb;--text:#172033;--muted:#627089;--input:#fff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
    .top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg)}
    h1{margin:0;font-size:17px;line-height:1.1}.hint{font-size:12px;color:var(--muted);font-weight:800}
    .toolbar{display:flex;gap:7px;align-items:center}.toolbar button{height:30px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);font-size:12px;font-weight:950;padding:0 10px;cursor:pointer}.main-btn,.ghost{min-height:32px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);font-size:12px;font-weight:950;padding:7px 10px;cursor:pointer}
    .toolbar button.active{background:#00856f;color:#fff;border-color:#00856f}.toolbar button[data-flow="card"].active{background:#2563eb;border-color:#2563eb}.toolbar button[data-flow="hold"].active{background:#ff5a1f;border-color:#ff5a1f}
    .canvas{padding:12px}.stage-grid{display:grid;grid-template-columns:repeat(3,minmax(300px,390px));gap:10px;align-items:start;justify-content:center}
    .window{--tone:#00856f;border:1px solid var(--border);border-top:3px solid var(--tone);border-radius:8px;background:var(--panel);box-shadow:0 18px 38px rgba(0,0,0,.24);overflow:visible;position:relative}
    .head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;background:var(--tone);color:#fff}
    .title{font-size:12px;font-weight:950;line-height:1.1}.sub{font-size:9px;font-weight:850;opacity:.9}
    .actions{display:flex;gap:4px}.icon{width:25px;height:25px;border:1px solid rgba(255,255,255,.36);border-radius:5px;background:rgba(255,255,255,.14);color:#fff;font-weight:950;display:grid;place-items:center;cursor:pointer}.icon.close{background:rgba(127,29,29,.34)}
    .config{position:absolute;right:8px;top:38px;width:230px;z-index:5;display:none;gap:6px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--panel);box-shadow:0 14px 34px rgba(0,0,0,.32)}.config.open{display:grid}
    .config-title{font-size:11px;font-weight:950;color:var(--muted);text-transform:uppercase}.config input,.config select,.config button{width:100%;height:30px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text);font-size:12px;font-weight:850;padding:0 7px}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:0}.split button:first-child{border-radius:6px 0 0 6px}.split button:last-child{border-left:0;border-radius:0 6px 6px 0}
    .body{padding:5px;display:grid;gap:5px}.section{border:1px solid var(--border);border-radius:6px;background:var(--card);padding:5px}.section-title{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;color:var(--muted);font-size:9px;font-weight:950;text-transform:uppercase}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .kv{min-width:0;border:1px solid var(--border);border-radius:5px;background:var(--panel);padding:4px}.kv label{display:block;font-size:8px;line-height:1;color:var(--muted);font-weight:900}.kv span{display:block;min-height:13px;font-size:11px;line-height:1.05;font-weight:850;overflow-wrap:anywhere}
    .history-ok{background:#052e1a;border-color:#15803d}.history-warn{background:#3a230b;border-color:#c2410c}.history-danger,.alert-danger{background:#3a0d0d;border-color:#ef4444;animation:pulseRed 1s ease-in-out infinite}[data-theme="light"] .history-ok{background:#ecfdf5}[data-theme="light"] .history-warn{background:#fff7ed}[data-theme="light"] .history-danger,[data-theme="light"] .alert-danger{background:#fef2f2}
    @keyframes pulseRed{0%,100%{box-shadow:0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 12px rgba(239,68,68,.65)}}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:4px}.field label{display:block;margin-bottom:2px;font-size:8.4px;color:var(--muted);font-weight:900}.field select{width:100%;height:28px;border:1px solid var(--border);border-radius:5px;background:var(--input);color:var(--text);font-size:10.5px;font-weight:800;padding:2px}
    .main-btn{width:100%;background:var(--tone);border-color:var(--tone);color:#fff;line-height:1.12;white-space:normal;overflow-wrap:anywhere}.decisions{display:grid;grid-template-columns:1fr 1fr;gap:4px}.decision{min-height:48px;border:0;border-radius:6px;color:#fff;font-size:9.4px;line-height:1.06;font-weight:950;white-space:pre-line;cursor:pointer;padding:6px 5px;overflow-wrap:anywhere}.danger{background:#dc2626}.success{background:#15803d}.warning{background:#ca8a04}.info{background:#2563eb}
    textarea{width:100%;height:245px;resize:none;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text);font-size:13px;line-height:1.2;font-weight:750;padding:8px;overflow:hidden}.final-text{height:286px;font-size:13px;line-height:1.18}.final-text.card{height:214px}
    .notice{position:fixed;right:12px;bottom:12px;display:grid;gap:6px;z-index:20}.toast{width:320px;border:1px solid var(--border);border-left:4px solid #38bdf8;border-radius:8px;background:var(--panel);padding:9px;font-size:12px;font-weight:850;box-shadow:0 12px 26px rgba(0,0,0,.25)}.toast.success{border-left-color:#22c55e;background:#062e1b}.toast.warn{border-left-color:#f59e0b;background:#351f05}
    .history-panel{position:fixed;right:12px;bottom:12px;width:620px;max-width:calc(100vw - 24px);z-index:30;border:1px solid var(--border);border-top:3px solid #00856f;border-radius:8px;background:var(--panel);box-shadow:0 18px 42px rgba(0,0,0,.34);display:none}.history-panel.open{display:block}.history-head{display:flex;justify-content:space-between;align-items:center;padding:7px 8px;background:#00856f;color:#fff;font-weight:950}.history-body{display:grid;grid-template-columns:150px 1fr;gap:6px;padding:6px}.history-list{display:grid;gap:4px;align-content:start}.history-list button{height:30px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text);font-weight:950}
    @media(max-width:1120px){.stage-grid{grid-template-columns:1fr}.window{max-width:390px;margin:auto}}
  </style>
</head>
<body data-theme="dark">
  <div class="top">
    <div>
      <h1>SAC Prevenção - Prévia V1</h1>
      <div class="hint">Fluxo completo com Falcon, Console e Tabulador</div>
    </div>
    <div class="toolbar">
      <button data-flow="banking" class="active">BANKING</button>
      <button data-flow="card">CARTÃO</button>
      <button data-flow="hold">HOLD</button>
      <button id="theme">☀</button>
    </div>
  </div>
  <main class="canvas">
    <div class="stage-grid" id="grid"></div>
  </main>
  <div class="notice" id="notice"></div>
  <div class="history-panel" id="history">
    <div class="history-head"><span>Histórico</span><button class="icon close" id="closeHistory">×</button></div>
    <div class="history-body">
      <div class="history-list"><button>49373570</button><button>49373601</button><button>49373744</button></div>
      <textarea readonly id="historyText"></textarea>
    </div>
  </div>
  <script>
    const STATUS_OPTIONS = ["Normal","Ativa","Bloqueado","Bloqueio Prevenção","Bloqueio Preventivo Falcon - 254","Cancelado","SPD 1","SPD 2","SPD 8","SPD 15","SPD 17","SPD 21","SPD 33"];
    const YES_NO = ["não","sim"];
    const HISTORY_SPD = ["não","sim","SPD 1","SPD 2","SPD 8","SPD 15","SPD 17","SPD 21","SPD 25","SPD 33"];
    const EMAIL_OPTIONS = ["de acordo","divergente","ausência de dados"];
    const DOC_OPTIONS = ["sem ressalvas","com ressalva","baixa qualidade","foto de tela","falsificação","editado","ausência de dados"];
    const STATEMENT_OPTIONS = ["sem suspeitas","com suspeita","sem histórico","triangulação","autofinanciamento"];
    const CARD_REVIEW = ["não","sim","autofinanciamento","dados inexistentes"];
    const flows = {
      banking: {
        label: "BANKING", tone: "#00856f", caseNumber: "49373570", value: "10.511,48",
        rule: "TETO_PIX_PF_CCSB", history: "0000000000", historyClass: "history-ok",
        transactionType: "Pagamento bancário de varejo", date: "08/06/2026 07:29:22",
        cpf: "36.986.078/0001-74", issuer: "Ifood", account: "16740", accountStatus: "Ativa", register: "12/09/2025",
        fields: { media: "não", spd: "Normal", email: "de acordo", histSpd: "não", doc: "sem ressalvas", extrato: "sem suspeitas" }
      },
      card: {
        label: "CARTÃO", tone: "#2563eb", caseNumber: "49373601", value: "289,90",
        rule: "CARD_ECOMMERCE_RISK", history: "0001000000", historyClass: "history-ok",
        cardNumber: "************3192", merchant: "SEG *Novo seguros Vitoria BR", flowType: "autorização ou lançamento de crédito", transactionType: "E-commerce", transDecision: "approve",
        cpf: "123.456.789-10", issuer: "Bemol", cardId: "12183", cardStatus: "Normal", register: "20/05/2026",
        fields: { merchantHistory: "não", purchase: "não" }
      },
      hold: {
        label: "HOLD", tone: "#ff5a1f", caseNumber: "49373744", value: "4.850,00",
        rule: "HOLD_PIX_PF_ALTO_RISCO", history: "0003003003", historyClass: "history-danger",
        transactionType: "Transferência Pix", date: "08/06/2026 09:14:03",
        cpf: "987.654.321-00", issuer: "Dock", account: "65420", accountStatus: "Bloqueio Preventivo Falcon - 254", register: "20/04/2024",
        fields: { media: "sim", spd: "SPD 8", email: "divergente", histSpd: "SPD 8", doc: "falsificação", extrato: "triangulação" }
      }
    };
    const decisions = ["FRAUDE","NÃO FRAUDE","NÃO FOI POSSÍVEL\nCONFIRMAR FRAUDE","NÃO FOI POSSÍVEL\nCONFIRMAR NÃO FRAUDE"];
    let current = new URLSearchParams(location.search).get("flow") || "banking";
    function kv(label, value, extra=""){return `<div class="kv ${extra}"><label>${label}</label><span>${value || "N/A"}</span></div>`}
    function section(title, html, tag=""){return `<div class="section"><div class="section-title"><span>${title}</span><span>${tag}</span></div>${html}</div>`}
    function norm(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase()}
    function alertIf(flag){return flag ? "alert-danger" : ""}
    function recentDate(v){const m=String(v||"").match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if(!m)return ""; const d=new Date(+m[3],+m[2]-1,+m[1]); const days=(Date.now()-d.getTime())/86400000; return alertIf(days>=0&&days<90)}
    function accountStatusRisk(v){return alertIf(norm(v)!=="NORMAL")}
    function personStatusRisk(v){return alertIf(!["NORMAL","ATIVO","ATIVA"].includes(norm(v)))}
    function yesRisk(v){return alertIf(norm(v)==="SIM")}
    function spdRisk(v){return alertIf(!["NAO","N/A","NAO APLICAVEL"].includes(norm(v)))}
    function docRisk(v){const n=norm(v); return alertIf(n.includes("RESSALVA")||n.includes("BAIXA QUALIDADE"))}
    function statementRisk(v){const n=norm(v); return alertIf(n.includes("RESSALVA")||n.includes("TRIANGULACAO")||n.includes("SUSPEITA")||n.includes("AUTOFINANCIAMENTO"))}
    function config(){return `<div class="config"><div class="config-title">Configurações</div><button data-act="theme">${document.body.dataset.theme==="dark"?"☀ Tema claro":"☾ Tema escuro"}</button><div class="split"><button data-act="minus">A-</button><button data-act="plus">A+</button></div><input value="Giasi Mandela" aria-label="Nome da assinatura"><select><option>SAC Prevenção</option><option>Dock Teck Prevenção</option><option>Personalizado</option></select><input placeholder="Complemento personalizado"><button>Salvar assinatura</button><button data-act="history">Histórico</button><button data-act="export">Exportar histórico .txt</button></div>`}
    function head(stage, flow){return `<div class="head"><div><div class="title">${stage} - ${flow.label}</div><div class="sub">${stage==="TABULADOR"?"Dados para decisão":"Coleta e conferência"}</div></div><div class="actions"><button class="icon" data-act="config">⚙</button><button class="icon">_</button><button class="icon close">×</button></div></div>${config()}`}
    function falcon(flow){
      const base = kv("Caso", flow.caseNumber)+kv("Valor", "R$ "+flow.value)+kv("Regra", flow.rule)+kv("Histórico", flow.history, flow.historyClass);
      const html = current==="card"
        ? `<div class="grid">${kv("Tipo transação", flow.flowType)}${kv("Estabelecimento", flow.merchant)}${kv("Tipo compra cartão", flow.transactionType)}${kv("Decisão transação", flow.transDecision)}${base}</div>`
        : `<div class="grid">${kv("Tipo transação", flow.transactionType)}${base}${kv("Data/Hora", flow.date)}</div>`;
      return `<div class="window" style="--tone:${flow.tone}">${head("FALCON",flow)}<div class="body">${section("Dados do Falcon",html,flow.label)}<button class="main-btn" style="--tone:${flow.tone}">Finalizar etapa</button></div></div>`;
    }
    function consoleWin(flow){
      const falconMini = current==="card" ? kv("Caso",flow.caseNumber)+kv("Estabelecimento",flow.merchant)+kv("Valor","R$ "+flow.value)+kv("Regra",flow.rule) : kv("Caso",flow.caseNumber)+kv("Tipo transação",flow.transactionType)+kv("Valor","R$ "+flow.value)+kv("Regra",flow.rule);
      const consoleMini = current==="card" ? kv("CPF/CNPJ",flow.cpf)+kv("ID cartão",flow.cardId)+kv("Status cartão",flow.cardStatus)+kv("Cadastro",flow.register,recentDate(flow.register)) : kv("CPF/CNPJ",flow.cpf)+kv("Conta",flow.account)+kv("Status conta",flow.accountStatus,accountStatusRisk(flow.accountStatus))+kv("Cadastro",flow.register,recentDate(flow.register));
      const fields = current==="card"
        ? field("Histórico no estabelecimento",CARD_REVIEW,flow.fields.merchantHistory)+field("Padrão de compra",CARD_REVIEW,flow.fields.purchase)
        : field("Status conta",STATUS_OPTIONS,flow.accountStatus)+field("Status Pessoa (SPD)",STATUS_OPTIONS,flow.fields.spd)+field("Mídia desabonadora",YES_NO,flow.fields.media)+field("Histórico SPD",HISTORY_SPD,flow.fields.histSpd)+field("E-mail, DDD e Endereço",EMAIL_OPTIONS,flow.fields.email)+field("Documentação",DOC_OPTIONS,flow.fields.doc)+field("Extrato",STATEMENT_OPTIONS,flow.fields.extrato);
      return `<div class="window" style="--tone:${flow.tone}">${head("CONSOLE",flow)}<div class="body">${section("Dados do Falcon",`<div class="grid">${falconMini}</div>`,"recebidos")}${section("Dados do Console",`<div class="grid">${consoleMini}</div>`,"coletados")}${section("Dropdowns de análise",`<div class="fields">${fields}</div>`,"padrão V1")}<button class="main-btn" style="--tone:${flow.tone}">Finalizar etapa</button></div></div>`;
    }
    function field(label,opts,selected){return `<div class="field"><label>${label}</label><select>${opts.map(o=>`<option ${o===selected?"selected":""}>${o}</option>`).join("")}</select></div>`}
    function tabText(flow,decision="FRAUDE"){
      if(current==="card") return `Valor da transação: ${flow.value}\nRegra: ${flow.rule}\nEstabelecimento: ${flow.merchant}\nStatus do cartão: ${flow.cardStatus}\nData de cadastro: ${flow.register}\nHistórico de compra no estabelecimento: não\nPadrão de compra: não\n\nDecisão: ${decision.replace(/\n/g," ")}\n\nGiasi Mandela | SAC Prevenção`;
      return `Valor da transação: ${flow.value}\nRegra: ${flow.rule}\nHistórico de Infrações: ${flow.history}\nMídia desabonadora: ${flow.fields.media}\nStatus conta: ${flow.accountStatus}\nStatus Pessoa (SPD): ${flow.fields.spd}\nData de cadastro: ${flow.register}\nE-mail, DDD e Endereço: ${flow.fields.email}\nHistórico SPD: ${flow.fields.histSpd}\nDocumentação: ${flow.fields.doc}\nExtrato: ${flow.fields.extrato}\n\nDecisão: ${decision.replace(/\n/g," ")}\n\nGiasi Mandela | SAC Prevenção`;
    }
    function tabulador(flow){
      const falconMini = current==="card" ? kv("Caso",flow.caseNumber)+kv("Estabelecimento",flow.merchant)+kv("Valor","R$ "+flow.value)+kv("Regra",flow.rule)+kv("Histórico",flow.history,flow.historyClass) : kv("Caso",flow.caseNumber)+kv("Tipo transação",flow.transactionType)+kv("Valor","R$ "+flow.value)+kv("Regra",flow.rule)+kv("Histórico",flow.history,flow.historyClass);
      const consoleMini = current==="card" ? kv("CPF/CNPJ",flow.cpf)+kv("Status cartão",flow.cardStatus)+kv("Cadastro",flow.register,recentDate(flow.register))+kv("Histórico no estabelecimento","não")+kv("Padrão de compra","não") : kv("CPF/CNPJ",flow.cpf)+kv("Conta",flow.account)+kv("Status conta",flow.accountStatus,accountStatusRisk(flow.accountStatus))+kv("Status Pessoa (SPD)",flow.fields.spd,personStatusRisk(flow.fields.spd))+kv("Cadastro",flow.register,recentDate(flow.register))+kv("Mídia desabonadora",flow.fields.media,yesRisk(flow.fields.media))+kv("E-mail, DDD e Endereço",flow.fields.email)+kv("Histórico SPD",flow.fields.histSpd,spdRisk(flow.fields.histSpd))+kv("Documentação",flow.fields.doc,docRisk(flow.fields.doc))+kv("Extrato",flow.fields.extrato,statementRisk(flow.fields.extrato));
      const buttons = decisions.map((d,i)=>`<button class="decision ${["danger","success","warning","info"][i]}" data-decision="${d}">${d}</button>`).join("");
      return `<div class="window tab-window" style="--tone:${flow.tone}">${head("TABULADOR",flow)}<div class="body tab-body">${section("Dados do Falcon",`<div class="grid">${falconMini}</div>`,"análise")}${section("Dados do Console",`<div class="grid three">${consoleMini}</div>`,"análise")}${section("Decisão",`<div class="decisions">${buttons}</div>`,"1-4")}</div></div>`;
    }
    function render(){
      document.querySelectorAll("[data-flow]").forEach(b=>b.classList.toggle("active",b.dataset.flow===current));
      const flow = flows[current];
      document.getElementById("grid").innerHTML = falcon(flow)+consoleWin(flow)+tabulador(flow);
      if(new URLSearchParams(location.search).get("final")==="1") setTimeout(()=>document.querySelector("[data-decision]")?.click(), 50);
    }
    document.addEventListener("click", e=>{
      const flowButton=e.target.closest("[data-flow]"); if(flowButton){current=flowButton.dataset.flow;render();return}
      if(e.target.id==="theme" || e.target.dataset.act==="theme"){document.body.dataset.theme=document.body.dataset.theme==="dark"?"light":"dark";document.getElementById("theme").textContent=document.body.dataset.theme==="dark"?"☀":"☾";render();return}
      if(e.target.dataset.act==="config"){e.target.closest(".window").querySelector(".config").classList.toggle("open");return}
      if(e.target.dataset.act==="history"){document.getElementById("history").classList.add("open");document.getElementById("historyText").value=tabText(flows[current]);return}
      if(e.target.dataset.act==="export"){toast("Histórico exportado em .txt.", "success");return}
      if(e.target.id==="closeHistory"){document.getElementById("history").classList.remove("open");return}
      const decision=e.target.closest("[data-decision]"); if(decision){const text=tabText(flows[current],decision.dataset.decision);document.querySelector(".tab-body").innerHTML=section("Tabulação pronta",`<textarea class="final-text ${current==="card"?"card":""}" readonly>${text}</textarea>`,"final")+`<div class="grid"><button class="main-btn">Copiar tabulação e finalizar</button><button class="ghost" id="change">Mudar decisão</button></div>`;toast("Dropdowns aplicados. Tabulação pronta.", "success");return}
      if(e.target.id==="change"){render();return}
    });
    function toast(msg,type=""){const host=document.getElementById("notice");const el=document.createElement("div");el.className="toast "+type;el.textContent=msg;host.appendChild(el);setTimeout(()=>el.remove(),5200)}
    render();
  </script>
</body>
</html>
