<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAC Prevenção - Prévia V3.2</title>
  <style>
    :root{--bg:#121a26;--panel:#1b2635;--card:#111927;--border:#465a73;--text:#edf3fb;--muted:#b9c7d9;--input:#0f1724;--banking:#00856f;--card:#2563eb;--hold:#ff5a1f;--history:#64748b}
    [data-theme="light"]{--bg:#f4f7fb;--panel:#fff;--card:#f8fafd;--border:#d5deeb;--text:#172033;--muted:#627089;--input:#fff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
    .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg)}
    h1{margin:0;font-size:17px;line-height:1.1}.hint{font-size:12px;color:var(--muted);font-weight:800}
    .toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.toolbar button{height:31px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);font-size:12px;font-weight:950;padding:0 10px;cursor:pointer}.toolbar button:hover,.toolbar button:focus{border-color:#38bdf8;box-shadow:0 0 0 2px rgba(56,189,248,.18);outline:none}.toolbar button.active{background:var(--banking);color:#fff;border-color:var(--banking)}.toolbar button[data-flow="card"].active{background:var(--card);border-color:var(--card)}.toolbar button[data-flow="hold"].active{background:var(--hold);border-color:var(--hold)}
    .canvas{padding:12px}.stage-grid{display:grid;grid-template-columns:repeat(3,minmax(300px,390px));gap:10px;align-items:start;justify-content:center}
    .window{--tone:var(--banking);border:1px solid var(--border);border-top:3px solid var(--tone);border-radius:8px;background:var(--panel);box-shadow:0 18px 38px rgba(0,0,0,.24);overflow:visible;position:relative}
    .head{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;background:var(--tone);color:#fff;cursor:grab;user-select:none;touch-action:none}.head:active,.history-head:active{cursor:grabbing}.window.minimized .body,.window.minimized .config{display:none!important}
    .title{font-size:12px;font-weight:950;line-height:1.1}.sub{font-size:9px;font-weight:850;opacity:.9}
    .actions{display:flex;gap:4px}.icon{width:25px;height:25px;border:1px solid rgba(255,255,255,.36);border-radius:5px;background:rgba(255,255,255,.14);color:#fff;font-weight:950;display:grid;place-items:center;cursor:pointer}.icon:hover,.icon:focus{filter:brightness(1.16);box-shadow:0 0 0 2px rgba(255,255,255,.18);outline:none}.icon.close{background:rgba(127,29,29,.34)}
    .config{position:absolute;left:8px;top:38px;width:258px;z-index:5;display:none;gap:7px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--panel);box-shadow:0 14px 34px rgba(0,0,0,.32)}.config.open{display:grid}
    .config-title{font-size:11px;font-weight:950;color:var(--muted);text-transform:uppercase}.config-preview{border:1px solid var(--border);border-radius:7px;background:var(--card);padding:7px;font-size:11px;font-weight:900;overflow-wrap:anywhere}.config input,.config select,.config button{width:100%;height:31px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text);font-size:12px;font-weight:850;padding:0 7px}.config input:hover,.config select:hover,.config button:hover,.config input:focus,.config select:focus,.config button:focus{border-color:#38bdf8;background:#12314a;color:#edf3fb;box-shadow:0 0 0 2px rgba(56,189,248,.22);outline:none}[data-theme="light"] .config input:hover,[data-theme="light"] .config select:hover,[data-theme="light"] .config button:hover,[data-theme="light"] .config input:focus,[data-theme="light"] .config select:focus,[data-theme="light"] .config button:focus{background:#eef7ff;color:#172033}.color-editor{display:none;gap:5px}.color-editor.open{display:grid}.color-editor label{display:grid;grid-template-columns:74px 1fr;gap:5px;align-items:center;font-size:10px;font-weight:950;color:var(--muted)}
    .split{display:grid;grid-template-columns:1fr auto 1fr;gap:0}.split button:first-child{border-radius:6px 0 0 6px}.split button:last-child{border-left:0;border-radius:0 6px 6px 0}.font-value{display:grid;place-items:center;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--card);color:var(--muted);font-size:11px;font-weight:950;padding:0 8px}.signature-editor{display:none;gap:6px}.signature-editor.open{display:grid}.signature-custom[hidden]{display:none}
    .body{padding:5px;display:grid;gap:5px}.section{border:1px solid var(--border);border-radius:6px;background:var(--card);padding:5px}.section-title{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;color:var(--muted);font-size:9px;font-weight:950;text-transform:uppercase}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
    .kv{position:relative;min-width:0;min-height:34px;margin-top:7px;border:1px solid var(--border);border-radius:5px;background:var(--panel);padding:7px 4px 4px;transition:border-color .15s,box-shadow .15s,background .15s,color .15s}.kv:hover,.field:hover{border-color:#38bdf8;background:#10263a;color:#edf3fb;box-shadow:0 0 0 2px rgba(56,189,248,.12)}[data-theme="light"] .kv:hover,[data-theme="light"] .field:hover{background:#eef7ff;color:#172033}.kv label{position:absolute;top:-8px;left:4px;max-width:calc(100% - 8px);padding:1px 3px;border-radius:3px;background:var(--card);font-size:8px;line-height:1;color:var(--muted);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kv span{display:flex;align-items:center;min-height:23px;font-size:11px;line-height:1.08;font-weight:850;overflow-wrap:anywhere;white-space:normal}[data-theme="light"] .kv:hover label,[data-theme="light"] .kv:hover span{color:#172033}
    .history-ok{background:#052e1a;border-color:#15803d}.history-warn,.missing,.alert-warn{background:#3a230b;border-color:#c2410c;animation:pulseOrange 1s ease-in-out infinite}.history-danger,.alert-danger{background:#3a0d0d;border-color:#ef4444;animation:pulseRed 1s ease-in-out infinite}[data-theme="light"] .history-ok{background:#ecfdf5}[data-theme="light"] .history-warn,[data-theme="light"] .missing,[data-theme="light"] .alert-warn{background:#fff7ed}[data-theme="light"] .history-danger,[data-theme="light"] .alert-danger{background:#fef2f2}
    @keyframes pulseRed{0%,100%{box-shadow:0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 12px rgba(239,68,68,.65)}}@keyframes pulseOrange{0%,100%{box-shadow:0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 12px rgba(245,158,11,.70)}}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:4px}.field{display:grid;gap:2px;min-width:0;border:1px solid var(--border);border-radius:6px;background:var(--panel);padding:4px}.field label{display:block;margin-bottom:0;font-size:8.4px;line-height:1.05;color:var(--muted);font-weight:900}.field select,.field input{width:100%;height:28px;border:1px solid var(--border);border-radius:5px;background:var(--input);color:var(--text);font-size:10.5px;font-weight:800;padding:2px}.field select:hover,.field select:focus,.field input:hover,.field input:focus{border-color:#38bdf8;background:#10263a;color:#edf3fb;outline:none;box-shadow:0 0 0 2px rgba(56,189,248,.16)}[data-theme="light"] .field select:hover,[data-theme="light"] .field select:focus,[data-theme="light"] .field input:hover,[data-theme="light"] .field input:focus{background:#eef7ff;color:#172033}
    .main-btn,.ghost{width:100%;min-height:32px;border:1px solid var(--border);border-radius:6px;background:var(--tone);color:#fff;font-size:12px;font-weight:950;padding:7px 10px;line-height:1.12;cursor:pointer;white-space:normal;overflow-wrap:anywhere}.ghost{background:transparent;color:var(--text)}.main-btn:hover,.ghost:hover{filter:brightness(1.12);box-shadow:0 0 0 2px rgba(56,189,248,.16)}
    .decisions{display:grid;grid-template-columns:1fr 1fr;gap:4px}.decision{min-height:50px;border:0;border-radius:6px;color:#fff;font-size:9.4px;line-height:1.06;font-weight:950;white-space:pre-line;cursor:pointer;padding:6px 5px;overflow-wrap:anywhere}.decision:hover{filter:brightness(1.12);box-shadow:0 0 0 2px rgba(255,255,255,.15)}.danger{background:#dc2626}.success{background:#15803d}.warning{background:#ca8a04}.info{background:#2563eb}
    textarea{width:100%;height:245px;resize:none;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text);font-size:13px;line-height:1.2;font-weight:750;padding:8px;overflow:hidden}.final-text{height:286px;font-size:13px;line-height:1.18}.final-text.card{height:214px}
    .notice{position:fixed;right:12px;bottom:12px;display:grid;gap:6px;z-index:50}.toast{width:320px;border:1px solid var(--border);border-left:4px solid #2563eb;border-radius:8px;background:var(--panel);color:var(--text);padding:9px;font-size:12px;font-weight:850;box-shadow:0 12px 26px rgba(0,0,0,.25)}.toast.success{border-left-color:#22c55e;background:#062e1b;color:#ecfdf5}.toast.warn{border-left-color:#f59e0b;background:#351f05;color:#fff7ed}.toast.warn-pulse{animation:pulseOrange 1.15s ease-in-out infinite}.toast.error{border-left-color:#dc2626;background:#3a0d0d;color:#fef2f2}[data-theme="light"] .toast{background:#fff;color:#172033}[data-theme="light"] .toast.success{background:#ecfdf5;color:#064e3b}[data-theme="light"] .toast.warn{background:#fff7ed;color:#7c2d12}[data-theme="light"] .toast.error{background:#fef2f2;color:#7f1d1d}
    .history-panel{position:fixed;right:12px;bottom:12px;width:690px;max-width:calc(100vw - 24px);max-height:min(620px,calc(100vh - 24px));z-index:40;border:1px solid var(--border);border-top:3px solid var(--history);border-radius:8px;background:var(--panel);box-shadow:0 18px 42px rgba(0,0,0,.34);display:none;overflow:hidden}.history-panel.open{display:block}.history-head{display:flex;justify-content:space-between;align-items:center;padding:7px 8px;background:var(--history);color:#fff;font-weight:950;cursor:grab;user-select:none;touch-action:none}.history-tools{display:grid;grid-template-columns:1fr 126px;gap:6px;padding:7px;border-bottom:1px solid var(--border);background:var(--card)}.history-tools input,.history-tools select{height:34px;border:1px solid var(--border);border-radius:7px;background:var(--input);color:var(--text);font-size:12px;font-weight:900;padding:7px 9px}.history-tools input:hover,.history-tools select:hover,.history-tools input:focus,.history-tools select:focus{border-color:#38bdf8;background:#12314a;color:#edf3fb;box-shadow:0 0 0 2px rgba(56,189,248,.18);outline:none}[data-theme="light"] .history-tools input:hover,[data-theme="light"] .history-tools select:hover,[data-theme="light"] .history-tools input:focus,[data-theme="light"] .history-tools select:focus{background:#eef7ff;color:#172033}.history-body{display:grid;grid-template-columns:220px 1fr;gap:6px;padding:6px}.history-list{display:grid;gap:4px;align-content:start;max-height:430px;overflow:auto}.history-list button{text-align:left;min-height:38px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text);font-weight:950;cursor:pointer}.history-list button:hover,.history-list button.active{border-color:#38bdf8;background:#10263a;color:#edf3fb;box-shadow:0 0 0 2px rgba(56,189,248,.12);transform:translateY(-1px)}[data-theme="light"] .history-list button:hover,[data-theme="light"] .history-list button.active{background:#eef7ff;color:#172033}.history-list small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.list-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px}.list-tabs button{border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text);font-size:12px;font-weight:950;padding:8px 6px;cursor:pointer}.list-tabs button:hover,.list-tabs button.active{border-color:#38bdf8;background:#12314a;color:#edf3fb;box-shadow:0 0 0 2px rgba(56,189,248,.14)}[data-theme="light"] .list-tabs button:hover,[data-theme="light"] .list-tabs button.active{background:#eef7ff;color:#172033}.allow-list{display:grid;gap:5px}.allow-item{display:grid;grid-template-columns:1fr 72px;gap:6px;border:1px solid var(--border);border-radius:7px;background:var(--card);padding:6px}.allow-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}.allow-actions{display:grid;grid-template-rows:1fr 1fr;gap:4px}.allow-actions button{border:0;border-radius:6px;color:#fff;font-size:10px;font-weight:950;cursor:pointer}.allow-actions .insert{background:#16a34a}.allow-actions .remove{background:#dc2626}.choice-popover{position:fixed;left:14px;top:72px;z-index:60;width:min(330px,calc(100vw - 28px));display:grid;gap:7px;padding:10px;border:1px solid var(--border);border-top:3px solid var(--banking);border-radius:8px;background:var(--panel);color:var(--text);box-shadow:0 18px 44px rgba(0,0,0,.32)}.choice-popover label{display:flex;gap:7px;align-items:flex-start;font-size:11px;font-weight:850}.choice-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}.choice-actions button{min-height:31px;border:1px solid var(--border);border-radius:6px;background:var(--banking);color:#fff;font-weight:950;cursor:pointer}.choice-actions button:last-child{background:transparent;color:var(--text)}
    @media(max-width:1120px){.stage-grid{grid-template-columns:1fr}.window{max-width:390px;margin:auto}.grid{grid-template-columns:1fr}.history-body{grid-template-columns:1fr}}
  </style>
</head>
<body data-theme="dark">
  <div class="top">
    <div>
      <h1>SAC Prevenção - Prévia V3.2</h1>
      <div class="hint">Janelas flutuantes, modo seguro, grids padronizados e janela LISTAS</div>
    </div>
    <div class="toolbar">
      <button data-flow="banking" class="active">BANKING</button>
      <button data-flow="card">CARTÃO</button>
      <button data-flow="hold">HOLD</button>
      <button id="allowBtn">LISTAS</button>
      <button id="theme">☀</button>
    </div>
  </div>
  <main class="canvas"><div class="stage-grid" id="grid"></div></main>
  <div class="notice" id="notice"></div>
  <div class="history-panel" id="history">
    <div class="history-head"><span>Histórico</span><button class="icon close" id="closeHistory">×</button></div>
    <div class="history-tools">
      <input id="historySearch" placeholder="Pesquisar caso, emissor ou conta">
      <select id="historyFilter"><option value="">Todos</option><option>BANKING</option><option>CARTÃO</option><option>HOLD</option></select>
    </div>
    <div class="history-body"><div class="history-list" id="historyList"></div><textarea readonly id="historyText"></textarea></div>
  </div>
  <script>
    const STATUS_OPTIONS = ["normal","ativo","bloqueado","bloqueio preventivo falcon 254","cancelada","spd 1","spd 2","spd 8","spd 15","spd 17","spd 21","spd 25","spd 33","outro"];
    const YES_NO = ["não","sim"];
    const HISTORY_SPD = ["não","sim","spd 1","spd 2","spd 8","spd 15","spd 17","spd 21","spd 25","spd 33","outro"];
    const EMAIL_OPTIONS = ["de acordo","divergente","sem informação"];
    const DOC_OPTIONS = ["sem ressalvas","com ressalvas","baixa qualidade","foto de tela","editado","falsificado","ilegível","danificado","sem arquivos"];
    const STATEMENT_OPTIONS = ["sem suspeitas","com suspeitas","triangulação","autofinanciamento","sem histórico"];
    const CARD_REVIEW = ["não","sim","autofinanciamento","ausência de dados"];
    const FLOW_COLOR_OPTIONS = [["#ef4444","vermelho"],["#ff5a1f","laranja vibrante"],["#f59e0b","amarelo"],["#22c55e","verde"],["#14b8a6","turquesa"],["#2563eb","azul"],["#7c3aed","violeta"]];
    const EMAIL_DIVERGENCE_OPTIONS = ["E-mail não se refere ao nome","DDD diferente da região do endereço"];
    const BAD_MEDIA_OPTIONS = ["Crimes contra a fé pública","Tráfico de drogas","Terrorismo","Crimes contra o patrimônio","Crimes contra o sistema financeiro","Crimes contra a ordem tributária","Crimes contra a administração da justiça","Crimes contra a administração pública","Falsidade ideológica","Receptação","Estelionato","Roubo (majorado ou qualificado)","Furto (majorado ou qualificado)","Estupro","Homicídio"];
    const flows = {
      banking:{label:"BANKING",tone:"#00856f",caseNumber:"49373570",value:"10.511,48",rule:"TETO_PIX_PF_CCSB",history:"0000000000",historyClass:"history-ok",transactionType:"Pagamento bancário de varejo",date:"08/06/2026 07:29",cpf:"36.986.078/0001-74",issuer:"Ifood",account:"16740",accountStatus:"ativo",register:"12/09/2025",fields:{media:"não",spd:"normal",email:"de acordo",histSpd:"não",doc:"sem ressalvas",extrato:"sem suspeitas"}},
      card:{label:"CARTÃO",tone:"#2563eb",caseNumber:"49373601",value:"289,90",rule:"CARD_ECOMMERCE_RISK",history:"0001000000",historyClass:"history-ok",cardNumber:"************3192",merchant:"SEG *Novo seguros Vitoria BR",flowType:"autorização ou lançamento de crédito",transactionType:"E-commerce",transDecision:"approve",date:"08/06/2026 08:41",cpf:"123.456.789-10",issuer:"Bemol",cardId:"12183",cardStatus:"normal",register:"20/05/2026",fields:{merchantHistory:"não",purchase:"não"}},
      hold:{label:"HOLD",tone:"#ff5a1f",caseNumber:"49373744",value:"4.850,00",rule:"HOLD_PIX_CONTENSAO_ALTO_RISCO",history:"0003003003",historyClass:"history-danger",transactionType:"Transferência Pix",date:"08/06/2026 09:14",cpf:"987.654.321-00",issuer:"Dock",account:"65420",accountStatus:"bloqueio preventivo falcon 254",register:"20/04/2024",fields:{media:"sim",spd:"spd 8",email:"divergente",histSpd:"spd 8",doc:"falsificado",extrato:"triangulação"}}
    };
    const decisions = ["FRAUDE","NÃO FRAUDE","NÃO FOI POSSÍVEL\nCONFIRMAR FRAUDE","NÃO FOI POSSÍVEL\nCONFIRMAR NÃO FRAUDE"];
    const historyRows = [
      {caseNumber:"49373570",issuer:"Ifood",account:"16740",flow:"BANKING"},
      {caseNumber:"49373601",issuer:"Bemol",account:"12183",flow:"CARTÃO"},
      {caseNumber:"49373744",issuer:"Dock",account:"65420",flow:"HOLD"}
    ];
    let current = new URLSearchParams(location.search).get("flow") || "banking";
    let safeMode = false;
    const norm = v => String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
    function kv(label,value,extra=""){return `<div class="kv ${value?extra:"missing"}"><label>${label}</label><span>${value||"N/A"}</span></div>`}
    function section(title,html,tag=""){return `<div class="section"><div class="section-title"><span>${title}</span><span>${tag}</span></div>${html}</div>`}
    function alertIf(flag){return flag?"alert-danger":""}
    function recentDate(v){const m=String(v||"").match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if(!m)return ""; const d=new Date(+m[3],+m[2]-1,+m[1]); const days=(Date.now()-d.getTime())/86400000; return alertIf(days>=0&&days<90)}
    function accountRisk(v){return alertIf(!["NORMAL","ATIVO","ATIVA"].includes(norm(v)))}
    function dropdownRisk(value, options){const n=norm(value); if(["SEM HISTORICO","SEM INFORMACAO","SEM ARQUIVOS","SEM DOCUMENTOS","AUSENCIA DE DADOS","NAO APLICAVEL"].includes(n)) return "alert-warn"; return n && n!==norm(options[0]) ? "alert-danger" : ""}
    function cardReviewRisk(value){const n=norm(value);if(n==="AUSENCIA DE DADOS")return "alert-warn";return n==="NAO"?"alert-danger":""}
    function field(label,opts,selected){const other=opts.some(o=>norm(o)==="OUTRO");return `<div class="field"><label>${label}</label><select data-other-select="${other?1:0}">${opts.map(o=>`<option ${norm(o)===norm(selected)?"selected":""}>${o}</option>`).join("")}</select>${other?`<input hidden placeholder="Digite o valor manualmente">`:""}</div>`}
    function colorOptions(selected){return FLOW_COLOR_OPTIONS.map(([color,label])=>`<option value="${color}" ${color===selected?"selected":""}>${label}</option>`).join("")}
    function config(stage){const sig=stage==="TABULADOR"?`<button data-act="signature">✎ Assinatura</button><div class="signature-editor"><div class="config-preview" id="sigPreview">Giasi Mandela | Backoffice Prevenção</div><input id="sigName" value="Giasi Mandela"><select id="sigSector"><option>SAC Prevenção</option><option>Dock Teck Prevenção</option><option selected>Backoffice Prevenção</option><option value="custom">Personalizado</option></select><input class="signature-custom" id="sigCustom" placeholder="Complemento personalizado" hidden><button>Salvar assinatura</button></div>`:"";const colors=`<button data-act="colors">Cores dos fluxos</button><div class="color-editor"><label>BANKING<select data-flow-color="banking">${colorOptions(flows.banking.tone)}</select></label><label>CARTÃO<select data-flow-color="card">${colorOptions(flows.card.tone)}</select></label><label>HOLD<select data-flow-color="hold">${colorOptions(flows.hold.tone)}</select></label></div>`;return `<div class="config"><div class="config-title">Configurações</div><button data-act="theme">${document.body.dataset.theme==="dark"?"☀ Tema claro":"☾ Tema escuro"}</button><div class="split"><button data-act="minus">A−</button><span class="font-value">105%</span><button data-act="plus">A+</button></div><button data-act="safe">${safeMode?"🛡 Seguro ligado":"⚠ Seguro desligado"}</button>${sig}${colors}<button data-act="history">Histórico</button></div>`}
    function head(stage,flow){const title=stage==="LISTAS"?"LISTAS":`${stage} - ${flow.label}`;return `<div class="head"><div><div class="title">${title}</div><div class="sub">${stage==="TABULADOR"?"Dados para decisão":stage==="LISTAS"?"Allowlist e Contenção":"Coleta e conferência"}</div></div><div class="actions"><button class="icon" data-act="config">⚙</button><button class="icon" data-act="minimize">_</button><button class="icon close" data-act="close">×</button></div></div>${config(stage)}`}
    function falconGrid(flow){const common=kv("Caso",flow.caseNumber)+kv("Valor","R$ "+flow.value)+kv("Regra",flow.rule)+kv("Data/Hora",flow.date);return current==="card"?`<div class="grid">${kv("Tipo transação",flow.flowType)}${kv("Estabelecimento",flow.merchant)}${kv("Tipo compra cartão",flow.transactionType)}${kv("Decisão transação",flow.transDecision)}${common}</div>`:`<div class="grid">${kv("Tipo transação",flow.transactionType)}${common}${kv("Histórico de infrações",flow.history,flow.historyClass)}</div>`}
    function consoleGrid(flow, includeStatus=true){return current==="card"?`<div class="grid">${kv("CPF/CNPJ",flow.cpf)}${kv("Emissor",flow.issuer)}${kv("Tratamento","Backoffice Brasil")}${kv("ID cartão",flow.cardId)}${kv("Cartão",flow.cardNumber)}${kv("Status cartão",flow.cardStatus)}${kv("Cadastro",flow.register,recentDate(flow.register))}</div>`:`<div class="grid">${kv("CPF/CNPJ",flow.cpf)}${kv("Emissor",flow.issuer)}${kv("Tratamento","Backoffice Brasil")}${kv("Conta",flow.account)}${includeStatus?kv("Status conta",flow.accountStatus,accountRisk(flow.accountStatus)):""}${kv("Cadastro",flow.register,recentDate(flow.register))}</div>`}
    function dropdownFields(flow){return current==="card"?field("Histórico no estabelecimento",CARD_REVIEW,flow.fields.merchantHistory)+field("Padrão de compra",CARD_REVIEW,flow.fields.purchase):field("Status conta",STATUS_OPTIONS,flow.accountStatus)+field("Status Pessoa (SPD)",STATUS_OPTIONS,flow.fields.spd)+field("Histórico SPD",HISTORY_SPD,flow.fields.histSpd)+field("Mídia desabonadora",YES_NO,flow.fields.media)+field("E-mail, DDD e Endereço",EMAIL_OPTIONS,flow.fields.email)+field("Documentação",DOC_OPTIONS,flow.fields.doc)+field("Extrato",STATEMENT_OPTIONS,flow.fields.extrato)}
    function dropdownGrid(flow){return current==="card"?`<div class="grid">${kv("Histórico no estabelecimento",flow.fields.merchantHistory,cardReviewRisk(flow.fields.merchantHistory))}${kv("Padrão de compra",flow.fields.purchase,cardReviewRisk(flow.fields.purchase))}</div>`:`<div class="grid">${kv("Status conta",flow.accountStatus,accountRisk(flow.accountStatus))}${kv("Status Pessoa (SPD)",flow.fields.spd,dropdownRisk(flow.fields.spd,STATUS_OPTIONS))}${kv("Histórico SPD",flow.fields.histSpd,dropdownRisk(flow.fields.histSpd,HISTORY_SPD))}${kv("Mídia desabonadora",flow.fields.media,dropdownRisk(flow.fields.media,YES_NO))}${kv("E-mail, DDD e Endereço",flow.fields.email,dropdownRisk(flow.fields.email,EMAIL_OPTIONS))}${kv("Documentação",flow.fields.doc,dropdownRisk(flow.fields.doc,DOC_OPTIONS))}${kv("Extrato",flow.fields.extrato,dropdownRisk(flow.fields.extrato,STATEMENT_OPTIONS))}</div>`}
    function tabText(flow,decision="FRAUDE"){const d=decision.replace(/\n/g," ");if(current==="card")return `Valor da transação: ${flow.value}\nRegra: ${flow.rule}\nEstabelecimento: ${flow.merchant}\nStatus do cartão: ${flow.cardStatus}\nData de cadastro: ${flow.register}\nHistórico de compra no estabelecimento: ${flow.fields.merchantHistory}\nPadrão de compra: ${flow.fields.purchase}\n\nDecisão: ${d}\n\nGiasi Mandela | Backoffice Prevenção`;return `Valor da transação: ${flow.value}\nRegra: ${flow.rule}\nHistórico de Infrações: ${flow.history}\nMídia desabonadora: ${flow.fields.media}\nStatus conta: ${flow.accountStatus}\nStatus Pessoa (SPD): ${flow.fields.spd}\nData de cadastro: ${flow.register}\nE-mail, DDD e Endereço: ${flow.fields.email}\nHistórico SPD: ${flow.fields.histSpd}\nDocumentação: ${flow.fields.doc}\nExtrato: ${flow.fields.extrato}\n\nDecisão: ${d}\n\nGiasi Mandela | Backoffice Prevenção`}
    function falcon(flow){return `<div class="window" style="--tone:${flow.tone}">${head("FALCON",flow)}<div class="body">${section("Dados do Falcon",falconGrid(flow),flow.label)}<button class="main-btn" data-finalize="falcon" style="--tone:${flow.tone}">Finalizar etapa</button></div></div>`}
    function consoleWin(flow){return `<div class="window" style="--tone:${flow.tone}">${head("CONSOLE",flow)}<div class="body">${section("Dados do Falcon",falconGrid(flow),"recebidos")}${section("Dados do Console",consoleGrid(flow,true),"coletados")}${section("Dropdowns de análise",`<div class="fields">${dropdownFields(flow)}</div>`,"padrão V3.2")}<button class="main-btn" data-finalize="console" style="--tone:${flow.tone}">Finalizar etapa</button></div></div>`}
    function tabulador(flow){const buttons=decisions.map((d,i)=>`<button class="decision ${["danger","success","warning","info"][i]}" data-decision-index="${i}" data-decision="${d}">${d}</button>`).join("");return `<div class="window tab-window" style="--tone:${flow.tone}">${head("TABULADOR",flow)}<div class="body tab-body">${section("Dados do Falcon",falconGrid(flow),"análise")}${section("Dados do Console",consoleGrid(flow,current==="card"),"coletados")}${section("Respostas dos dropdowns",dropdownGrid(flow),"escolhidas")}${section("Decisão",`<div class="decisions">${buttons}</div>`,"1-4")}</div></div>`}
    function listItem(issuer,identifierLabel,identifier,caseNumber,issuerId){return `<div class="allow-item"><div class="allow-row">${kv("Emissor",issuer)}${kv(identifierLabel,identifier)}${kv("Número do caso",caseNumber)}${kv("ID emissor",issuerId)}</div><div class="allow-actions"><button class="insert">INSERIR</button><button class="remove">REMOVER</button></div></div>`}
    function listas(active="allowlist"){const flow=flows.hold;const allow=`<div class="allow-list">${listItem("Dock","CPF/CNPJ","98765432100","49373744","103")}${listItem("Ifood","Id Conta","16740","49373570","520")}</div>`;const cont=`<div class="allow-list">${listItem("Dock","CPF/CNPJ","98765432100","49373744","103")}</div>`;return `<div class="window allow-window" style="--tone:var(--history);position:fixed;left:18px;top:86px;width:min(650px,calc(100vw - 36px));z-index:30">${head("LISTAS",{...flow,label:"LISTAS",tone:"var(--history)"})}<div class="body">${section("Allowlist e Contenção",`<div class="list-tabs"><button data-list-preview="allowlist" class="${active==="allowlist"?"active":""}">ALLOWLIST (2)</button><button data-list-preview="contencao" class="${active==="contencao"?"active":""}">CONTENÇÃO (1)</button></div>${active==="contencao"?cont:allow}`,"não fraude")}</div></div>`}
    function render(){document.querySelectorAll("[data-flow]").forEach(b=>{const active=b.dataset.flow===current;b.classList.toggle("active",active);b.style.background=active?flows[b.dataset.flow].tone:"";b.style.borderColor=active?flows[b.dataset.flow].tone:""});const flow=flows[current];document.getElementById("grid").innerHTML=falcon(flow)+consoleWin(flow)+tabulador(flow);document.querySelectorAll(".window").forEach(win=>enableDrag(win,".head"));if(new URLSearchParams(location.search).get("final")==="1")setTimeout(()=>document.querySelector("[data-decision]")?.click(),50);if(new URLSearchParams(location.search).get("history")==="1")setTimeout(openHistory,60);if(new URLSearchParams(location.search).get("allowlist")==="1"||new URLSearchParams(location.search).get("listas")==="1")setTimeout(openListas,80)}
    function enableDrag(panel,handleSelector){const handle=panel.querySelector(handleSelector);if(!handle||panel.dataset.dragReady)return;panel.dataset.dragReady="1";let armed=false,dragging=false,frozen=false,sx=0,sy=0,sl=0,st=0,sw=0,previousUserSelect="";const clamp=(v,min,max)=>Math.min(Math.max(v,min),max);const freeze=()=>{if(frozen)return;panel.style.position="fixed";panel.style.left=sl+"px";panel.style.top=st+"px";panel.style.width=sw+"px";panel.style.right="auto";panel.style.bottom="auto";panel.style.transform="none";frozen=true};const start=e=>{if(e.target.closest("button,input,select,textarea,a"))return;const r=panel.getBoundingClientRect();document.querySelectorAll(".window,.history-panel").forEach(item=>item.style.zIndex="39");panel.style.zIndex="40";armed=true;dragging=false;frozen=false;sx=e.clientX;sy=e.clientY;sl=r.left;st=r.top;sw=r.width;previousUserSelect=document.body.style.userSelect||"";document.body.style.userSelect="none";e.preventDefault()};const move=e=>{if(!armed)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!dragging){if(Math.hypot(dx,dy)<3)return;dragging=true;freeze()}const r=panel.getBoundingClientRect();panel.style.left=clamp(sl+dx,0,Math.max(0,innerWidth-r.width))+"px";panel.style.top=clamp(st+dy,0,Math.max(0,innerHeight-Math.min(r.height,innerHeight)))+"px";e.preventDefault()};const stop=()=>{armed=false;dragging=false;document.body.style.userSelect=previousUserSelect};handle.addEventListener("pointerdown",start);document.addEventListener("pointermove",move,true);document.addEventListener("pointerup",stop,true);document.addEventListener("pointercancel",stop,true)}
    function renderHistoryRows(){const query=norm(document.getElementById("historySearch").value);const filter=document.getElementById("historyFilter").value;const rows=historyRows.filter(r=>(!filter||r.flow===filter)&&(!query||norm(`${r.caseNumber} ${r.issuer} ${r.account}`).includes(query)));document.getElementById("historyList").innerHTML=rows.map((r,i)=>`<button class="${i===0?"active":""}" data-case="${r.caseNumber}">${r.caseNumber}<small>${r.issuer} · Conta ${r.account} · ${r.flow}</small></button>`).join("")||"<small>Nenhum histórico encontrado.</small>";document.getElementById("historyText").value=rows[0]?tabText(flows[rows[0].flow==="CARTÃO"?"card":rows[0].flow.toLowerCase()]):""}
    function openHistory(){document.getElementById("history").classList.add("open");enableDrag(document.getElementById("history"),".history-head");renderHistoryRows()}
    function openListas(active="allowlist"){document.querySelector(".allow-window")?.remove();document.body.insertAdjacentHTML("beforeend",listas(active));document.querySelectorAll(".allow-window").forEach(win=>enableDrag(win,".head"))}
    function toast(msg,type=""){const host=document.getElementById("notice");const el=document.createElement("div");el.className="toast "+type;el.textContent=msg;host.appendChild(el);setTimeout(()=>el.remove(),7600)}
    function openChoice(title,options){document.querySelector(".choice-popover")?.remove();const el=document.createElement("div");el.className="choice-popover";el.innerHTML=`<strong>${title}</strong>${options.map((option,index)=>`<label><input type="checkbox" ${index===0?"checked":""}><span>${option}</span></label>`).join("")}<div class="choice-actions"><button data-choice-save>Salvar</button><button data-choice-close>Fechar</button></div>`;document.body.appendChild(el)}
    document.addEventListener("click",e=>{const action=e.target.closest("[data-act]");const fb=e.target.closest("[data-flow]");const listTab=e.target.closest("[data-list-preview]");if(fb){current=fb.dataset.flow;render();return}if(listTab){openListas(listTab.dataset.listPreview);return}if(e.target.id==="allowBtn"){openListas();return}if(e.target.id==="theme"||action?.dataset.act==="theme"){document.body.dataset.theme=document.body.dataset.theme==="dark"?"light":"dark";document.getElementById("theme").textContent=document.body.dataset.theme==="dark"?"☀":"☾";render();return}if(action?.dataset.act==="config"){action.closest(".window").querySelector(".config").classList.toggle("open");return}if(action?.dataset.act==="colors"){action.closest(".config").querySelector(".color-editor").classList.toggle("open");return}if(action?.dataset.act==="safe"){safeMode=!safeMode;action.textContent=safeMode?"🛡 Seguro ligado":"⚠ Seguro desligado";toast(safeMode?"Modo seguro ligado.":"Modo seguro desligado: edição manual por duplo clique disponível.",safeMode?"success":"warn");return}if(action?.dataset.act==="history"){openHistory();return}if(action?.dataset.act==="signature"){action.closest(".config").querySelector(".signature-editor").classList.toggle("open");return}if(e.target.id==="sigSector"){document.getElementById("sigCustom").hidden=e.target.value!=="custom";return}if(e.target.id==="closeHistory"){document.getElementById("history").classList.remove("open");return}if(e.target.closest("[data-choice-close]")){e.target.closest(".choice-popover")?.remove();return}if(e.target.closest("[data-choice-save]")){e.target.closest(".choice-popover")?.remove();toast("Detalhes salvos para a tabulação.","success");return}const decision=e.target.closest("[data-decision]");if(decision){const text=tabText(flows[current],decision.dataset.decision);document.querySelector(".tab-body").innerHTML=section("Tabulação pronta",`<textarea class="final-text ${current==="card"?"card":""}" readonly>${text}</textarea>`,"final")+`<div class="grid two"><button class="main-btn" data-copy-final>Copiar</button><button class="ghost" id="change">Mudar decisão</button></div>`;toast("Tudo certo: decisão aplicada e tabulação copiada.","success");return}if(e.target.id==="change"){render();return}});
    document.addEventListener("click",async e=>{const action=e.target.closest("[data-act]");const win=e.target.closest(".window");if(action?.dataset.act==="close"&&win){win.remove();toast("Janela fechada.","info");return}if(action?.dataset.act==="minimize"&&win){win.classList.toggle("minimized");return}const finalize=e.target.closest("[data-finalize]");if(finalize){finalize.closest(".window")?.remove();toast("Etapa finalizada e dados enviados para a próxima fase.","success");return}const copyFinal=e.target.closest("[data-copy-final]");if(copyFinal){const panel=copyFinal.closest(".window");const text=panel?.querySelector("textarea")?.value||"";try{await navigator.clipboard.writeText(text)}catch(_err){}panel?.remove();toast("Tabulação copiada. Processo finalizado.","success");return}const listAction=e.target.closest(".allow-actions button");if(listAction){const item=listAction.closest(".allow-item");if(!item)return;const isApply=listAction.classList.contains("insert");item.remove();toast(isApply?"Dados simulados inseridos e caso removido da aba.":"Caso removido da aba.",isApply?"success":"warn");return}});
    document.addEventListener("change",e=>{if(e.target.matches("[data-flow-color]")){const flow=e.target.dataset.flowColor;const color=e.target.value;const duplicate=Object.entries(flows).some(([name,data])=>name!==flow&&data.tone===color);if(duplicate){e.target.value=flows[flow].tone;toast("Cada fluxo precisa ter uma cor diferente.","warn");return}flows[flow].tone=color;toast("Cor do fluxo atualizada.","success");render();return}if(e.target.matches("[data-other-select='1']")){const input=e.target.closest(".field").querySelector("input");if(input)input.hidden=norm(e.target.value)!=="OUTRO"}const label=e.target.closest(".field")?.querySelector("label")?.textContent||"";if(norm(label).includes("MIDIA DESABONADORA")&&norm(e.target.value)==="SIM")openChoice("Tipo de mídia desabonadora",BAD_MEDIA_OPTIONS);if(norm(label).includes("E-MAIL")&&norm(e.target.value)==="DIVERGENTE")openChoice("Detalhes da divergência",EMAIL_DIVERGENCE_OPTIONS);if(e.target.id==="sigSector"){document.getElementById("sigCustom").hidden=e.target.value!=="custom"}});
    document.addEventListener("dblclick",e=>{const cell=e.target.closest(".kv");if(!cell)return;if(safeMode){toast("Desligue o modo seguro para editar manualmente.","warn");return}const value=cell.querySelector("span");if(!value||value.querySelector("input"))return;const input=document.createElement("input");input.value=value.textContent;input.style.width="100%";value.replaceChildren(input);input.focus();const save=()=>{value.textContent=input.value||"N/A";toast("Informação ajustada manualmente.","info")};input.addEventListener("keydown",event=>{if(event.key==="Enter")save()});input.addEventListener("blur",save,{once:true})});
    document.addEventListener("keydown",e=>{const tag=e.target?.tagName?.toLowerCase();if(["input","select","textarea"].includes(tag)&&e.key!=="Escape")return;const win=[...document.querySelectorAll(".window")].at(-1);if(!win)return;const lower=e.key.toLowerCase();if(e.key==="Escape"){win.remove();e.preventDefault();return}if(lower==="m"){win.classList.toggle("minimized");e.preventDefault();return}if(lower==="p"){win.style.position="";win.style.left="";win.style.top="";win.style.width="";win.style.right="";win.style.bottom="";win.style.transform="";win.classList.remove("minimized");e.preventDefault();return}if(lower==="t"){document.getElementById("theme")?.click();e.preventDefault();return}if(lower==="r"||e.key==="0"){render();toast("Prévia recarregada.","info");e.preventDefault();return}if(lower==="a"){const target=document.querySelector(".tab-window")||win;target.querySelector("[data-act='config']")?.click();target.querySelector("[data-act='signature']")?.click();e.preventDefault();return}if(e.key==="Enter"){(win.querySelector("[data-finalize]")||win.querySelector("[data-copy-final]"))?.click();e.preventDefault();return}if(["1","2","3","4"].includes(e.key)){document.querySelector(`[data-decision-index="${Number(e.key)-1}"]`)?.click();e.preventDefault();return}});
    document.getElementById("historySearch").addEventListener("input",renderHistoryRows);document.getElementById("historyFilter").addEventListener("change",renderHistoryRows);document.getElementById("historyList").addEventListener("click",e=>{const btn=e.target.closest("[data-case]");if(!btn)return;document.querySelectorAll(".history-list button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");const row=historyRows.find(r=>r.caseNumber===btn.dataset.case);if(row)document.getElementById("historyText").value=tabText(flows[row.flow==="CARTÃO"?"card":row.flow.toLowerCase()])});
    render();
  </script>
</body>
